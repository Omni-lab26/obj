<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halftick design options</title>
<!-- 案の見本。?theme=a|b|c で切り替える。撮影は scripts/shot-design-options.mjs -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d9dbe0; padding: 40px 40px 48px; font-family: var(--font-body); }
  .board-title { font: 600 15px/1.4 Inter, sans-serif; color: #2a2d33; margin-bottom: 6px; }
  .board-sub { font: 400 13px/1.5 "Noto Sans JP", sans-serif; color: #50545c; margin-bottom: 24px; }
  .row { display: flex; gap: 36px; align-items: flex-start; }
  .label { font: 500 12px/1 Inter, sans-serif; color: #50545c; margin: 0 0 10px 4px; letter-spacing: .04em; }

  /* ---------- theme tokens ---------- */
  .t-a { --bg:#0B0D10; --surface:#12161B; --surface2:#171C22; --line:#232A33; --text:#E9ECEF; --muted:#8A949F; --accent:#FFB020; --accent-ink:#0B0D10; --alert:#FF5A4F; --up:#2BD576; --down:#FF5A4F;
          --font-body:"IBM Plex Sans JP",sans-serif; --font-head:"IBM Plex Sans JP",sans-serif; --font-num:"IBM Plex Mono",monospace; --radius:6px; --title-weight:700; }
  .t-b { --bg:#F4EFE6; --surface:#FFFCF6; --surface2:#EFE8DC; --line:#E3D9C9; --text:#1E1A15; --muted:#7C7164; --accent:#1F5C4A; --accent-ink:#FFFCF6; --alert:#C2432B; --up:#1F7A4F; --down:#B33A2A;
          --font-body:"Zen Kaku Gothic New",sans-serif; --font-head:"Shippori Mincho B1",serif; --font-num:"Zen Kaku Gothic New",sans-serif; --radius:16px; --title-weight:700; }
  .t-c { --bg:#FFFFFF; --surface:#F3F4F7; --surface2:#E9EBF0; --line:#E6E8EE; --text:#0A0B0D; --muted:#6A7180; --accent:#4B3BFF; --accent-ink:#FFFFFF; --alert:#FF3B30; --up:#00A86B; --down:#FF3B30;
          --font-body:"Inter","Noto Sans JP",sans-serif; --font-head:"Inter","Noto Sans JP",sans-serif; --font-num:"Inter",sans-serif; --radius:22px; --title-weight:800; }

  .phone { width: 393px; height: 852px; border-radius: 44px; background: var(--bg); color: var(--text); overflow: hidden; position: relative;
           box-shadow: 0 0 0 10px #111, 0 30px 60px rgba(0,0,0,.25); font-family: var(--font-body); }
  .status { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px; font: 600 15px/1 Inter, sans-serif; }
  .scroll { position: absolute; top: 50px; bottom: 84px; left: 0; right: 0; overflow: hidden; }
  .num { font-family: var(--font-num); font-feature-settings: "tnum"; }
  .muted { color: var(--muted); }
  svg { display: block; }

  /* tab bar */
  .tabs { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; display: flex; justify-content: space-around; padding-top: 10px; border-top: 1px solid var(--line); background: var(--bg); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); width: 64px; }
  .tab.on { color: var(--text); }
  .t-a .tab.on { color: var(--accent); }
  .t-c .tab.on { color: var(--accent); }

  /* header */
  .hdr { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 4px; }
  .logo { display: flex; align-items: baseline; gap: 6px; font: 800 22px/1 var(--font-head); letter-spacing: -.01em; }
  .t-a .logo { font: 600 17px/1 var(--font-num); letter-spacing: .02em; }
  .t-b .logo { font: 800 24px/1 var(--font-head); }
  .mark { display: inline-flex; align-items: flex-end; gap: 3px; height: 16px; }
  .mark i { display: block; width: 3px; background: var(--accent); border-radius: 1px; }
  .mark i:nth-child(1) { height: 16px; } .mark i:nth-child(2) { height: 8px; }
  .date { padding: 2px 20px 0; font-size: 13px; color: var(--muted); }

  /* signature: 4 ticks timeline */
  .ticks { margin: 14px 20px 6px; display: grid; grid-template-columns: repeat(4,1fr); position: relative; }
  .ticks:before { content: ""; position: absolute; left: 0; right: 0; top: 18px; height: 1px; background: var(--line); }
  .tick { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .tick .bar { width: 3px; height: 18px; background: var(--muted); border-radius: 1px; opacity: .5; }
  .tick.done .bar { opacity: 1; background: var(--text); }
  .tick.now .bar { height: 36px; margin-top: -18px; background: var(--accent); opacity: 1; width: 4px; }
  .tick.next .bar { height: 9px; margin-top: 9px; }
  .tick .t { font: 600 13px/1 var(--font-num); }
  .tick .n { font-size: 10px; color: var(--muted); }
  .tick.now .t { color: var(--accent); }
  .t-c .tick.now .bar { border-radius: 4px; }

  /* cards */
  .feed { padding: 8px 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; position: relative; }
  .t-a .card { background: transparent; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 4px; }
  .t-a .feed { gap: 0; }
  .t-b .card { box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(60,40,10,.05); }
  .t-c .card { padding: 16px 18px 16px 22px; }
  .t-c .card:before { content: ""; position: absolute; left: 10px; top: 18px; width: 4px; height: 22px; border-radius: 2px; background: var(--accent); }
  .t-c .card.brk:before { background: var(--alert); }
  .slot { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .slot .num { font-weight: 600; color: var(--text); }
  .badge { font: 700 10px/1 var(--font-body); padding: 4px 6px; border-radius: 4px; background: var(--alert); color: #fff; letter-spacing: .04em; }
  .t-b .badge { border-radius: 999px; padding: 4px 8px; }
  .t-c .badge { border-radius: 999px; padding: 4px 8px; }
  .title { font: var(--title-weight) 17px/1.45 var(--font-head); letter-spacing: -.005em; }
  .t-a .title { font-size: 15.5px; font-weight: 600; }
  .t-b .title { font-size: 18px; line-height: 1.5; }
  .t-c .title { font-size: 18px; line-height: 1.35; letter-spacing: -.02em; }
  .meta { display: flex; align-items: center; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .hot { color: var(--accent); font-weight: 700; }
  .t-a .hot { color: var(--accent); }
  .t-b .hot { color: var(--accent); }
  .preview { margin-top: 10px; padding: 10px 12px; border-radius: calc(var(--radius) - 4px); background: var(--surface2); font-size: 12.5px; line-height: 1.55; }
  .t-a .preview { background: var(--surface); border-left: 2px solid var(--accent); border-radius: 0; }
  .who { font-weight: 700; } .role { color: var(--muted); font-size: 11px; }
  .who-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--up); margin-right: 6px; vertical-align: middle; }

  /* post detail */
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px 10px; }
  .nav .mid { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .post { padding: 0 20px; }
  .post .title { font-size: 21px; line-height: 1.4; }
  .t-a .post .title { font-size: 19px; }
  .byline { display: flex; align-items: center; gap: 8px; margin: 10px 0 12px; font-size: 12px; color: var(--muted); }
  .owner { font-weight: 700; color: var(--text); }
  .chip { font-size: 10px; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  .body { font-size: 14px; line-height: 1.75; }
  .facts { margin: 12px 0; border-radius: calc(var(--radius) - 2px); background: var(--surface); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; row-gap: 6px; font-size: 12.5px; }
  .t-a .facts { border: 1px solid var(--line); background: transparent; }
  .facts .v { font-family: var(--font-num); font-weight: 600; text-align: right; }
  .src { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .src u { color: var(--text); text-decoration-color: var(--muted); }
  .acts { display: flex; gap: 8px; margin: 12px 0 0; }
  .act { font-size: 12px; padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
  .t-a .act { border-radius: 4px; }
  .act.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .disc-h { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 8px; margin-top: 14px; border-top: 6px solid var(--surface); }
  .t-a .disc-h { border-top: 1px solid var(--line); }
  .disc-h .h { font: 700 15px/1 var(--font-head); display: flex; gap: 8px; align-items: baseline; }
  .sort { font-size: 12px; display: flex; gap: 4px; align-items: center; padding: 6px 10px; border-radius: 999px; background: var(--surface); }
  .newpill { margin: 2px 20px 8px; font-size: 11.5px; color: var(--accent); font-weight: 700; }
  .c { padding: 8px 20px 4px; position: relative; }
  .c .hd { font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
  .c .tx { font-size: 13.5px; line-height: 1.65; margin-top: 3px; }
  .c .ft { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); margin-top: 6px; align-items: center; }
  .c.d1 { margin-left: 22px; border-left: 2px solid var(--line); padding-left: 14px; }
  .c.d2 { margin-left: 44px; border-left: 2px solid var(--line); padding-left: 14px; }
  .more { margin: 4px 0 0 58px; font-size: 12px; color: var(--accent); font-weight: 700; }
  .composer { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 10px; padding: 12px 14px 30px; }
  .composer .in { flex: 1; border-radius: 999px; background: var(--surface); padding: 0 16px; display: flex; align-items: center; font-size: 13px; color: var(--muted); }
  .t-a .composer .in { border-radius: 6px; border: 1px solid var(--line); }
  .composer .send { width: 42px; border-radius: 999px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
  .t-a .composer .send { border-radius: 6px; }

  /* chat room */
  .room-h { display: flex; align-items: center; gap: 10px; padding: 6px 14px 12px; border-bottom: 1px solid var(--line); }
  .room-h .nm { font: 700 16px/1.2 var(--font-head); }
  .room-h .sb { font-size: 11px; color: var(--muted); }
  .msgs { padding: 14px 14px; display: flex; flex-direction: column; gap: 12px; }
  .day { align-self: center; font-size: 11px; color: var(--muted); }
  .m { max-width: 80%; }
  .m .n { font-size: 11px; color: var(--muted); margin: 0 0 4px 4px; }
  .bub { background: var(--surface); padding: 9px 12px; border-radius: 16px; font-size: 13.5px; line-height: 1.55; }
  .t-a .bub { border-radius: 6px; }
  .me { align-self: flex-end; }
  .me .bub { background: var(--accent); color: var(--accent-ink); }
  .share { border-radius: calc(var(--radius) - 2px); border: 1px solid var(--line); background: var(--bg); overflow: hidden; margin-bottom: 6px; }
  .share .in { padding: 10px 12px; }
  .share .title { font-size: 14px; line-height: 1.45; }
  .share .ft { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line); }
  .share .go { color: var(--accent); font-weight: 700; }
  .tm { font-size: 10px; color: var(--muted); margin: 4px 4px 0; }
  .me .tm { text-align: right; }
</style>
</head>
<body>
<div class="board-title" id="bt"></div>
<div class="board-sub" id="bs"></div>
<div class="row" id="row"></div>

<template id="screens">
  <div>
    <div class="label">ホーム（配信）</div>
    <div class="phone">
      <div class="status"><span>16:10</span><span>●●● 5G ▮</span></div>
      <div class="scroll">
        <div class="hdr">
          <div class="logo"><span class="mark"><i></i><i></i></span>Halftick</div>
          <div class="muted" style="font-size:12px">日本語 ▾</div>

      </div>

  <div>

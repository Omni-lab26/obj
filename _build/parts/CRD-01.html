<article class="obj" id="CRD-01" data-name="Feature Card" data-ja="特集カード" data-vector="Editorial" data-size="l" data-desc="App Store「Today」風の大きな特集カード。タップで記事に展開。">
  <div class="obj-stage" data-bg="grouped">
    <div class="crd01-row">

      <div class="crd01-card" data-card="night" data-tone="night">

          <div class="crd01-artwrap"><div class="crd01-art art art-4" data-flip="cover"></div></div>
          <div class="crd01-shade" data-flip="scale"></div>

          </div>

        <div class="crd01-face crd01-face--paper">

    <template data-article="night">
      <div class="crd01-byline"><span class="av av-1" aria-hidden="true">H</span><span><b>佐藤 春</b>文・写真 ・ 4分で読める</span></div>
      <p class="crd01-lead">街の灯り、星空、月明かり。暗い場所での撮影は難しいと思われがちですが、いくつかのコツを押さえるだけで、写真は見違えるほど変わります。</p>
      <h4><span>01</span>手ぶれは「体」で止める</h4>
      <p class="crd01-p">夜はシャッタースピードが遅くなり、わずかな揺れが写真全体のぼやけにつながります。壁や手すりに体を預け、息を吐ききった瞬間にシャッターを。2秒のセルフタイマーを使うだけでも、解像感は大きく変わります。</p>
      <blockquote class="crd01-quote"><p>光が少ないほど、待つ時間が写真をつくる。</p><cite>— 佐藤 春</cite></blockquote>
      <h4><span>02</span>街の色は、そのまま残す</h4>
      <p class="crd01-p">ナトリウム灯のオレンジ、ネオンの青。ホワイトバランスを無理に整えず、街が持つ色をそのまま残すと、夜らしい空気感が生まれます。</p>
      <h4><span>03</span>露出は少しだけ暗めに</h4>
      <p class="crd01-p">明るく撮ろうとすると、ハイライトが白く飛んでしまいがち。露出をわずかにマイナスへ振ると、光の粒がくっきりと浮かび上がります。</p>
      <div class="crd01-appcard">
        <span class="crd01-icon" aria-hidden="true"><svg class="i"><use href="#i-camera-fill"/></svg></span>
        <span class="crd01-appt"><span class="crd01-appn">Lumen – 夜景カメラ</span><span class="crd01-apps">写真／ビデオ</span></span>
        <button class="crd01-get" type="button" data-app="lumen" aria-label="Lumen を入手"><span class="crd01-gl">入手</span><svg class="crd01-ring" viewBox="0 0 28 28" aria-hidden="true"><circle class="crd01-rt" cx="14" cy="14" r="11"/><circle class="crd01-rp" cx="14" cy="14" r="11"/><rect x="10.5" y="10.5" width="7" height="7" rx="1.5"/></svg></button>
      </div>
    </template>
    <template data-article="coffee">
      <div class="crd01-sep" aria-hidden="true"></div>
      <p class="crd01-lead">特別な道具がなくても、おいしいコーヒーは淹れられます。大切なのは、豆の鮮度と挽き目、そしてお湯の温度。</p>
      <h4><span>01</span>挽くのは、淹れる直前に</h4>
      <p class="crd01-p">コーヒーの香りは、挽いた瞬間から少しずつ逃げていきます。ミルがあれば、飲む分だけをその都度挽くのがいちばんの近道です。</p>
      <blockquote class="crd01-quote"><p>一杯の味は、最初の30秒の蒸らしで決まる。</p><cite>— 伊藤 蓮</cite></blockquote>
      <h4><span>02</span>お湯は 92℃ 前後</h4>
      <p class="crd01-p">沸騰したお湯を一度ポットに移すと、ちょうどよい温度に。熱すぎると苦味が、ぬるすぎると酸味が強く出ます。</p>
    </template>
  </div>
  <ul class="obj-notes"><li>押すとカードが沈む</li><li>タップで記事に展開</li><li>× / Esc で元に戻る</li><li>「入手」でダウンロード表示</li></ul>
</article>
<script>
(() => {
  const root = document.getElementById('CRD-01');
  if (!root) return;
  const stage = root.querySelector('.obj-stage');
  const reader = root.querySelector('.crd01-reader');
  const shadow = root.querySelector('.crd01-shadow');
  const clip = root.querySelector('.crd01-clip');
  const scroller = root.querySelector('.crd01-scroll');
  const inner = root.querySelector('.crd01-inner');
  const head = root.querySelector('.crd01-head');
  const body = root.querySelector('.crd01-body');
  const closeBtn = root.querySelector('.crd01-close');
  const scrim = root.querySelector('.crd01-scrim');
  const reduce = () => window.ObjKit && ObjKit.reducedMotion;

  /* iOS-like spring sampled into a CSS linear() easing (falls back to the iOS curve) */
  const springEase = (zeta, w) => {
    const wd = w * Math.sqrt(Math.max(1e-6, 1 - zeta * zeta)), pts = [];
    for (let i = 0; i <= 48; i++) {
      const t = i / 48;
      const v = zeta >= 1 ? 1 - Math.exp(-w * t) * (1 + w * t) : 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
      pts.push(i === 48 ? 1 : +v.toFixed(4));
    }
    return `linear(${pts.join(', ')})`;
  };
  const hasLinear = window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0, 1)');
  const EASE_OPEN = hasLinear ? springEase(0.8, 9.6) : 'cubic-bezier(.32,.72,0,1)';
  const EASE_CLOSE = hasLinear ? springEase(1, 8.5) : 'cubic-bezier(.32,.72,0,1)';

  /* ---------- press feedback ---------- */
  root.querySelectorAll('.crd01-hit').forEach((hit) => {
    const card = hit.closest('.crd01-card');
    const up = () => card.classList.remove('is-pressed');
    hit.addEventListener('pointerdown', (e) => { if (e.button === 0) card.classList.add('is-pressed'); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => hit.addEventListener(t, up));
    hit.addEventListener('click', () => { up(); open(card); });
  });

  /* ---------- 入手 → progress ring → 開く (state shared by every copy of the button) ---------- */
  const apps = {};
  const syncGet = (app) => root.querySelectorAll(`.crd01-get[data-app="${app}"]`).forEach((b) => {
    const s = apps[app] || 'get';
    b.classList.toggle('is-loading', s === 'loading');
    b.querySelector('.crd01-gl').textContent = s === 'done' ? '開く' : '入手';
    b.setAttribute('aria-label', s === 'done' ? 'Lumen を開く' : s === 'loading' ? 'ダウンロード中' : 'Lumen を入手');
  });
  root.addEventListener('click', (e) => {
    const b = e.target.closest('.crd01-get');
    if (!b) return;
    e.stopPropagation();
    const app = b.dataset.app;
    if (apps[app] && apps[app] !== 'get') return;
    apps[app] = 'loading'; syncGet(app);
    setTimeout(() => { apps[app] = 'done'; syncGet(app); }, reduce() ? 300 : 1800);
  });

  /* ---------- FLIP expand / collapse ---------- */
  let state = 'idle', current = null, anims = [];
  const rel = (r, o) => ({ x: r.left - o.left, y: r.top - o.top, w: r.width, h: r.height });

  function geometry(card) {
    const sW = stage.clientWidth, sH = stage.clientHeight;
    const narrow = sW < 560;
    const W = narrow ? sW : Math.min(sW - 24, 760);
    const H = narrow ? sH : sH - 24;
    const cw = card.offsetWidth, ch = card.offsetHeight;
    return { W, H, L: Math.round((sW - W) / 2), T: narrow ? 0 : 12, R: narrow ? 18 : 28, cw, ch, Hh: Math.round(Math.min(ch, Math.max(300, H * 0.56))) };
  }
  function layout(card) {
    const g = geometry(card);
    Object.assign(reader.style, { left: g.L + 'px', top: g.T + 'px', width: g.W + 'px', height: g.H + 'px' });
    reader.style.setProperty('--crd01-r', g.R + 'px');
    const pad = card.dataset.tone === 'paper' ? 22 : 20;
    reader.style.setProperty('--crd01-colw', (g.cw - pad * 2) + 'px');
    reader.style.setProperty('--crd01-padl', Math.max(pad, Math.round((g.W - 600) / 2)) + 'px');
    head.style.height = g.Hh + 'px';
    // art "covers" the header with the card's aspect ratio → uniform scale, never distorted
    const art = head.querySelector('[data-flip="cover"]');
    if (art) {
      const k = Math.max(g.W / g.cw, g.Hh / g.ch);
      Object.assign(art.style, { width: g.cw * k + 'px', height: g.ch * k + 'px', left: (g.W - g.cw * k) / 2 + 'px', top: (g.Hh - g.ch * k) / 2 + 'px' });
    }
    return g;
  }
  function flipFrames(card) {
    const fEls = [...card.querySelectorAll('[data-flip]')];
    const lEls = [...head.querySelectorAll('[data-flip]')];
    return lEls.map((el, i) => {
      const f = fEls[i].getBoundingClientRect(), l = el.getBoundingClientRect();
      const kind = el.dataset.flip;
      let sx = f.width / l.width, sy = f.height / l.height;
      if (kind === 'move') sx = sy = f.height / l.height || 1;
      if (kind === 'cover') sy = sx;
      // applied with transform-origin 0 0 → maps the element's final box onto its box in the card
      return { el, t: `translate(${f.left - l.left}px, ${f.top - l.top}px) scale(${sx}, ${sy})` };
    });
  }
  const clipFor = (r, o, rad) => `inset(${r.top - o.top}px ${o.right - r.right}px ${o.bottom - r.bottom}px ${r.left - o.left}px round ${rad}px)`;
  const stopAll = () => { anims.forEach((a) => a.cancel()); anims = []; };
  const run = (el, kf, opt) => { const a = el.animate(kf, opt); anims.push(a); return a; };

  function open(card) {
    if (state !== 'idle') return;
    state = 'opening'; current = card;
    const tone = card.dataset.tone;
    reader.dataset.tone = tone;
    head.replaceChildren(card.querySelector('.crd01-face').cloneNode(true));
    body.replaceChildren(root.querySelector(`template[data-article="${card.dataset.card}"]`).content.cloneNode(true));
    Object.keys(apps).forEach(syncGet);
    reader.hidden = false;
    reader.classList.add('is-anim');
    const g = layout(card);
    scroller.scrollTop = 0;
    const cr = card.getBoundingClientRect();
    const rr = reader.getBoundingClientRect();
    const frames = flipFrames(card);
    card.classList.add('is-hidden');
    scrim.classList.add('is-on');

    if (reduce()) {
      run(reader, [{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' }).finished.then(done, () => {});
      return;
    }
    const D = 640, opt = { duration: D, easing: EASE_OPEN, fill: 'backwards' };
    const artwrap = head.querySelector('.crd01-artwrap');
    frames.forEach(({ el, t }) => run(el, [{ transform: t, transformOrigin: '0 0' }, { transform: 'none', transformOrigin: '0 0' }], opt));
    if (artwrap) {
      const ar = artwrap.getBoundingClientRect();
      run(artwrap, [{ clipPath: clipFor(cr, ar, 0) }, { clipPath: 'inset(0px 0px 0px 0px round 0px)' }], opt);
    }
    run(clip, [{ clipPath: clipFor(cr, rr, 20 * cr.width / g.cw) }, { clipPath: `inset(0px 0px 0px 0px round ${g.R}px)` }], opt);
    run(shadow, [{ transform: `translate(${cr.left - rr.left}px, ${cr.top - rr.top}px) scale(${cr.width / rr.width}, ${cr.height / rr.height})`, opacity: .6 }, { transform: 'none', opacity: 1 }], opt);
    run(body, [{ opacity: 0, transform: 'translateY(28px)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: 140, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' });
    run(closeBtn, [{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 260, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' });
    anims[0].finished.then(done, () => {});
    function done() {
      if (state !== 'opening') return;
      anims = [];
      reader.classList.remove('is-anim');
      state = 'open';
      closeBtn.focus({ preventScroll: true });
    }
  }

  function close() {
    if (state !== 'open') return;
    state = 'closing';
    const card = current;
    const s = scroller.scrollTop;
    reader.classList.add('is-anim');
    scroller.scrollTop = 0;
    const g = layout(card);
    const rr = reader.getBoundingClientRect();
    const cr = card.getBoundingClientRect();
    const frames = flipFrames(card);
    scrim.classList.remove('is-on');
    const finish = () => {
      if (state !== 'closing') return;
      stopAll();
      card.classList.remove('is-hidden');
      reader.hidden = true; reader.classList.remove('is-anim');
      head.replaceChildren(); body.replaceChildren();
      state = 'idle'; current = null;
      card.querySelector('.crd01-hit').focus({ preventScroll: true });
    };
    if (reduce()) { run(reader, [{ opacity: 1 }, { opacity: 0 }], { duration: 180 }).finished.then(finish, () => {}); return; }
    const D = 520, opt = { duration: D, easing: EASE_CLOSE, fill: 'forwards' };
    frames.forEach(({ el, t }) => run(el, [{ transform: 'none', transformOrigin: '0 0' }, { transform: t, transformOrigin: '0 0' }], opt));
    const artwrap = head.querySelector('.crd01-artwrap');
    if (artwrap) {
      const ar = artwrap.getBoundingClientRect();
      run(artwrap, [{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: clipFor(cr, ar, 0) }], opt);
    }
    run(inner, [{ transform: `translateY(${-s}px)` }, { transform: 'none' }], opt);
    run(clip, [{ clipPath: `inset(0px 0px 0px 0px round ${g.R}px)` }, { clipPath: clipFor(cr, rr, 20) }], opt);
    run(shadow, [{ transform: 'none', opacity: 1 }, { transform: `translate(${cr.left - rr.left}px, ${cr.top - rr.top}px) scale(${cr.width / rr.width}, ${cr.height / rr.height})`, opacity: .5 }], opt);
    run(body, [{ opacity: 1 }, { opacity: 0 }], { duration: 130, easing: 'ease-out', fill: 'forwards' });
    run(closeBtn, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.6)' }], { duration: 160, easing: 'ease-out', fill: 'forwards' });
    anims[0].finished.then(finish, () => {});
  }

  closeBtn.addEventListener('click', close);
  scrim.addEventListener('click', close);
  reader.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); return; }
    if (e.key === 'Tab') { // keep focus inside the article
      const f = [...reader.querySelectorAll('button')].filter((b) => !b.disabled && b.offsetParent);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  addEventListener('resize', () => { if (state === 'open' && current) layout(current); }, { passive: true });
})();
</script>

  const tabsBox = A.querySelector('.nav02-tabs');
  const track = A.querySelector('.nav02-track');
  const lens = A.querySelector('.nav02-lens');
  const tabs = [...A.querySelectorAll('.nav02-tab')];
  const screens = [...A.querySelectorAll('.nav02-scr')];

  const geo = (i) => ({ x: tabs[i].offsetLeft + tabs[i].offsetWidth / 2, w: tabs[i].offsetWidth });

  /* lens spring: critically-ish damped with a little overshoot; stretches with velocity */
  const L = { x: 0, w: 0, vx: 0, vw: 0, tx: 0, tw: 0, k: 420, c: 30, raf: 0, last: 0, press: false };
  const paint = () => {
    const stretch = Math.min(Math.abs(L.vx) * 0.04, 20);
    const squish = Math.min(Math.abs(L.vx) * 0.00006, 0.06);
    const w = L.w + stretch;
    lens.style.width = w.toFixed(2) + 'px';
    lens.style.transform = `translateX(${(L.x - w / 2).toFixed(2)}px) scale(${L.press ? 1.06 : 1}, ${((L.press ? 1.1 : 1) * (1 - squish)).toFixed(4)})`;
  };
  const step = (t) => {
    const dt = Math.min(0.032, (t - (L.last || t)) / 1000 || 0.016);
    L.last = t;
    const sub = 4, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      L.vx += (L.k * (L.tx - L.x) - L.c * L.vx) * h; L.x += L.vx * h;
      L.vw += (L.k * (L.tw - L.w) - L.c * L.vw) * h; L.w += L.vw * h;
    }
    paint();
    const done = Math.abs(L.tx - L.x) < 0.2 && Math.abs(L.vx) < 4 && Math.abs(L.tw - L.w) < 0.2 && Math.abs(L.vw) < 4;

      s.classList.toggle('is-on', on);

  const nearest = (x) => {
    let best = 0, bd = Infinity;
    tabs.forEach((t, j) => { const d = Math.abs(geo(j).x - x); if (d < bd) { bd = d; best = j; } });
    return best;
  };
  tabsBox.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved && Math.abs(e.clientX - drag.x0) > 6) drag.moved = true;
    if (!drag.moved) return;
    const first = geo(0).x, last = geo(tabs.length - 1).x;
    const x = Math.min(last + 8, Math.max(first - 8, e.clientX - drag.left));
    const n = nearest(x);
    tabs.forEach((t, j) => t.classList.toggle('is-sel', j === n));
    lensTo(x, geo(n).w);
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const x = (drag.moved ? e.clientX : drag.x0) - drag.left;
    drag = null;
    L.press = false; L.k = 420; L.c = 30;
    tabsBox.classList.remove('is-press');
    select(nearest(x));
  };
  tabsBox.addEventListener('pointerup', endDrag);
  tabsBox.addEventListener('pointercancel', endDrag);
  tabs.forEach((t, i) => t.addEventListener('click', (e) => { if (e.detail === 0) { e.stopPropagation(); select(i); } })); // keyboard activation
  tabsBox.addEventListener('click', () => {
    if (!mode) return; // compact states: tapping the round tab restores the full bar
    if (mode === 'search') { sinput.value = ''; sfield.classList.remove('has-text'); sinput.blur(); showScreen(sel); }
    setMode(''); placeLens(true);
  });
  track.addEventListener('keydown', (e) => {
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); select(e.key === 'Home' ? 0 : tabs.length - 1, { focus: true }); return; }
    if (!d) return;
    e.preventDefault();
    select((sel + d + tabs.length) % tabs.length, { focus: true });
  });

  /* search: the round button grows into a field, the tab bar shrinks to the current tab */
  sicon.addEventListener('click', () => {
    setMode('search');
    showScreen('search');
    setTimeout(() => sinput.focus({ preventScroll: true }), reduced() ? 0 : 260);
  });
  const sclear = sfield.querySelector('.nav02-sclear');
  const syncClear = () => { const has = !!sinput.value; sfield.classList.toggle('has-text', has); sclear.tabIndex = has ? 0 : -1; };
  sinput.addEventListener('input', syncClear);
  sclear.addEventListener('click', () => { sinput.value = ''; syncClear(); sinput.focus(); });
  sinput.addEventListener('keydown', (e) => { if (e.key === 'Escape') { sinput.value = ''; syncClear(); setMode(''); showScreen(sel); sicon.focus(); placeLens(true); } });

  /* minimise on scroll down, restore on scroll up (passive + rAF) */
  const syncEdge = () => { const s = activeScreen(); if (s) edgeT.style.opacity = String(Math.min(1, s.scrollTop / 24)); };
  let raf = 0, lastY = 0, lastScr = null;
  const onScroll = (e) => {
    const s = e.currentTarget;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const y = s.scrollTop;
      if (s !== lastScr) { lastScr = s; lastY = y; }
      const dy = y - lastY;
      lastY = y;
      edgeT.style.opacity = String(Math.min(1, y / 24));
      if (mode === 'search') return;
      if (y < 24) setMode('');
      else if (dy > 3 && y > 60) { if (mode !== 'min') { placeLens(true); setMode('min'); } }
      else if (dy < -5) setMode('');
    });
  };
  screens.forEach((s) => s.addEventListener('scroll', onScroll, { passive: true }));
  screens.forEach((s) => { s.inert = !s.classList.contains('is-on'); });
  A.querySelectorAll('.nav02-chip').forEach((c, _, all) => c.addEventListener('click', () => all.forEach((x) => x.setAttribute('aria-pressed', String(x === c)))));

  /* initial lens position once layout (and fonts) are ready */
  const init = () => placeLens(true);
  requestAnimationFrame(init);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(init));
  new ResizeObserver(() => { if (!drag) placeLens(true); }).observe(track);

  /* ═════════ B · classic ═════════ */
  const B = root.querySelector('.nav02-b');
  const btabs = [...B.querySelectorAll('.nav02-btab')];
  const bscreens = [...B.querySelectorAll('.nav02-bscr')];
  const btop = B.querySelector('.nav02-btop');
  const btitle = B.querySelector('.nav02-btitle');
  const bbar = B.querySelector('.nav02-bbar');
  const badge = B.querySelector('.nav02-badge');
  let bsel = 0, braf = 0, titleT = 0;
  const bsync = () => {
    braf = 0;
    const s = bscreens[bsel];
    btop.classList.toggle('is-scrolled', s.scrollTop > 1);
    bbar.classList.toggle('is-edge', s.scrollHeight - s.clientHeight - s.scrollTop < 1);
  };
  const bselect = (i, focus) => {
    if (i === bsel) { bscreens[i].scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }); return; } // tap again → scroll to top
    bsel = i;
    btabs.forEach((t, j) => {
      const on = j === i;
      t.classList.toggle('is-sel', on);
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
    });
    bscreens.forEach((s, j) => { s.classList.toggle('is-on', j === i); s.inert = j !== i; });
    bounce(btabs[i]);
    clearTimeout(titleT);
    btitle.classList.add('is-swap');
    titleT = setTimeout(() => { btitle.textContent = bscreens[i].dataset.title; btitle.classList.remove('is-swap'); }, 110);
    if (badge && i === 2 && !badge.classList.contains('is-gone')) {
      setTimeout(() => { badge.classList.add('is-gone'); btabs[2].setAttribute('aria-label', '通知'); }, 650);
    }
    bsync();
    if (focus) btabs[i].focus();
  };
  btabs.forEach((t, i) => t.addEventListener('click', () => bselect(i)));
  bbar.addEventListener('keydown', (e) => {
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    bselect((bsel + d + btabs.length) % btabs.length, true);
  });
  bscreens.forEach((s, j) => {
    s.inert = j !== 0;
    s.addEventListener('scroll', () => { if (!braf) braf = requestAnimationFrame(bsync); }, { passive: true });
  });
  requestAnimationFrame(bsync);
})();
</script>

    { a: 5, s: '240% 130%', p: '85% 70%', video: '3.9万', loc: '鳥取砂丘', cap: '砂丘を歩く', likes: '4,118' },
    { a: 7, s: '230% 120%', p: '30% 40%', video: '2.2万', loc: 'アトリエ', cap: '色づくりの裏側', likes: '2,906' },
    { a: 1, s: '210% 120%', p: '50% 90%', video: '1.4万', f: 'hue-rotate(-14deg)', loc: '江ノ島', cap: '夕日が沈むまで', likes: '1,775' },
    { a: 8, s: '260% 140%', p: '50% 50%', video: '9,820', loc: '代官山', cap: 'ハンドドリップの音', likes: '1,203' },
    { a: 3, s: '240% 130%', p: '30% 85%', video: '7,450', f: 'hue-rotate(20deg)', loc: '八ヶ岳', cap: '霧の森を歩く', likes: '980' },
    { a: 6, s: '250% 140%', p: '70% 20%', video: '6,010', f: 'hue-rotate(-40deg)', loc: '北海道', cap: '星空タイムラプス', likes: '1,640' },
  ];
  const TAGGED = [
    { a: 8, s: '140% 140%', p: '30% 30%', by: ['mio_k', 'av-2', 'M'], loc: '中目黒', cap: '@haru.photo とカフェ巡り', likes: '412' },
    { a: 7, s: '160% 140%', p: '70% 80%', by: ['yuna', 'av-4', 'Y'], loc: '表参道', cap: '撮ってもらった！', likes: '608' },
    { a: 1, s: '150% 130%', p: '60% 70%', by: ['sora_travel', 'av-5', 'S'], loc: '江ノ島', cap: '撮影旅行 with @haru.photo', likes: '1,026' },
    { a: 3, s: '150% 130%', p: '50% 50%', by: ['aoi', 'av-7', 'A'], loc: '高尾山', cap: '朝の登山', likes: '377' },
    { a: 2, s: '170% 150%', p: '20% 60%', by: ['ren.design', 'av-6', 'R'], loc: '葉山', cap: '海辺のワークショップ', likes: '529' },
    { a: 4, s: '160% 150%', p: '80% 30%', by: ['kaito.dev', 'av-3', 'K'], loc: '渋谷', cap: '夜景撮影会おつかれさま', likes: '844' },
    { a: 5, s: '170% 150%', p: '30% 80%', by: ['sora_travel', 'av-5', 'S'], loc: '鳥取砂丘', cap: '砂丘ロケ、また行きたい', likes: '1,318' },
    { a: 6, s: '180% 150%', p: '60% 30%', by: ['ren.design', 'av-6', 'R'], loc: '北海道', cap: 'オーロラ遠征メンバー', likes: '702' },
    { a: 8, s: '180% 180%', p: '70% 20%', f: 'hue-rotate(-12deg)', by: ['mio_k', 'av-2', 'M'], loc: '清澄白河', cap: '朝カフェの会', likes: '366' },
    { a: 2, s: '200% 160%', p: '80% 80%', by: ['aoi', 'av-7', 'A'], loc: '逗子', cap: '夏の終わりの海', likes: '451' },
    { a: 7, s: '200% 170%', p: '10% 30%', f: 'hue-rotate(25deg)', by: ['yuna', 'av-4', 'Y'], loc: 'ギャラリー', cap: '展示に来てくれた！', likes: '583' },
    { a: 3, s: '190% 160%', p: '80% 40%', by: ['kaito.dev', 'av-3', 'K'], loc: '奥多摩', cap: 'キャンプの朝', likes: '417' },
    { a: 1, s: '190% 150%', p: '20% 60%', f: 'hue-rotate(15deg)', by: ['sora_travel', 'av-5', 'S'], loc: '小豆島', cap: 'フェリーからの夕日', likes: '894' },
    { a: 4, s: '200% 170%', p: '20% 90%', f: 'hue-rotate(30deg)', by: ['ren.design', 'av-6', 'R'], loc: '六本木', cap: 'デザインウィークにて', likes: '760' },
    { a: 5, s: '160% 140%', p: '60% 40%', f: 'hue-rotate(-20deg) saturate(1.2)', by: ['yuna', 'av-4', 'Y'], loc: 'ドバイ', cap: '撮影ありがとう〜', likes: '1,092' },
  ];
  const SETS = [POSTS, REELS, TAGGED];
  const COUNT = ['<b>248</b>件の投稿', '<b>32</b>本のリール', '<b>56</b>件のタグ付け'];
  const artStyle = (d, extra = '') => `background-size:${d.s};background-position:${d.p};${d.f ? `filter:${d.f};` : ''}${extra}`;

  /* — Build grids — */
  const grids = $$('.sns18-grid');
  grids.forEach((g, gi) => {
    g.innerHTML = SETS[gi].map((d, i) => {
      const kind = [d.pin && '固定', d.multi && '複数枚', d.video && `動画 ${d.video}回再生`].filter(Boolean).join('、');
      let ov = '';
      if (d.video) ov += `<span class="sns18-ov sns18-ov--video"><span class="sns18-views">${icon('i-play-fill')}${d.video}</span></span>`;
      if (d.pin) ov += `<span class="sns18-ov">${icon('i-pin-fill', 'sns18-badge sns18-badge--pin')}</span>`;
      else if (d.multi) ov += `<span class="sns18-ov">${icon('i-square-on-square', 'sns18-badge')}</span>`;
      if (d.by) ov += `<span class="sns18-ov"><span class="av ${d.by[1]} sns18-by">${d.by[2]}</span></span>`;
      return `<button class="sns18-tile" type="button" data-g="${gi}" data-i="${i}" aria-label="${d.loc}の投稿${kind ? '（' + kind + '）' : ''}"${gi ? ' tabindex="-1"' : ''}><span class="sns18-img art art-${d.a}" style="${artStyle(d)}"></span>${ov}</button>`;
    }).join('');
  });

  /* — Tabs with cross-fade + height morph — */
  const tabs = $$('.sns18-tab');
  const panels = $('.sns18-panels');
  const seg = $('.sns18-seg');
  let tab = 0;
  function setTab(t, focus) {
    if (t === tab) return;
    const from = grids[tab], to = grids[t];
    tab = t;
    tabs.forEach((b, i) => { b.setAttribute('aria-selected', String(i === t)); b.tabIndex = i === t ? 0 : -1; });
    if (focus) tabs[t].focus({ preventScroll: true });
    $('.sns18-ink').style.setProperty('--t', t);
    $('.sns18-count').innerHTML = COUNT[t];
    seg.classList.toggle('is-off', t === 1);
    from.setAttribute('aria-hidden', 'true');
    to.removeAttribute('aria-hidden');
    $$('.sns18-tile', from).forEach((b) => (b.tabIndex = -1));
    $$('.sns18-tile', to).forEach((b) => b.removeAttribute('tabindex'));
    panels.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' });
  }
  tabs.forEach((b, i) => b.addEventListener('click', () => setTab(i)));
  $('.sns18-tabs').addEventListener('keydown', (e) => {
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    setTab((tab + d + 3) % 3, true);
  });

  /* — Ratio toggle — */
  $$('button', seg).forEach((b, i) => b.addEventListener('click', () => {
    $$('button', seg).forEach((x) => x.setAttribute('aria-checked', String(x === b)));
    seg.style.setProperty('--s', i);
    wrap.classList.toggle('is-square', b.dataset.r === 'sq');
  }));
  seg.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const b = $$('button', seg)[e.key === 'ArrowLeft' ? 0 : 1];
    b.click(); b.focus();
  });

  /* — Lightbox — */
  const lb = $('.sns18-lb');
  const media = $('.sns18-lb-media');
  const track = $('.sns18-lb-track');
  const dots = $('.sns18-lb-dots');
  const pages = $('.sns18-lb-pages');
  const play = $('.sns18-lb-play');
  const prog = $('.sns18-lb-prog');
  const dur = $('.sns18-lb-dur');
  const EASE = 'cubic-bezier(.32,.72,0,1)';
  let cur = null, page = 0, nPages = 1, anim = null, busy = false;

  function layoutTarget(ar) {
    const W0 = stage.clientWidth, H0 = stage.clientHeight;
    const top = 68, bottom = 108;
    const availW = W0 - 32, availH = H0 - top - bottom;
    const w = Math.min(availW, availH * ar, 460), h = w / ar;
    return { x: (W0 - w) / 2, y: top + (availH - h) / 2, w, h };
  }
  function fromTile(tile, tgt) {
    const S = stage.getBoundingClientRect(), T = tile.getBoundingClientRect();
    const s = T.width / tgt.w;
    const dx = T.left - S.left + T.width / 2 - (tgt.x + tgt.w / 2);
    const dy = T.top - S.top + T.height / 2 - (tgt.y + tgt.h / 2);
    const iy = Math.max(0, (tgt.h - T.height / s) / 2);
    return { transform: `translate3d(${dx}px,${dy}px,0) scale(${s})`, clip: `inset(${iy}px 0px ${iy}px 0px round 0px)` };
  }
  function setPage(p, animate = true) {
    page = Math.max(0, Math.min(nPages - 1, p));
    track.style.transition = animate && !reduced() ? '' : 'none';
    track.style.transform = `translate3d(${-page * 100}%,0,0)`;
    $$('i', dots).forEach((d, i) => d.classList.toggle('is-on', i === page));
    pages.textContent = `${page + 1}/${nPages}`;
  }
  function open(tile) {
    if (busy || cur) return;
    const gi = +tile.dataset.g, d = SETS[gi][+tile.dataset.i];
    cur = { tile, d, gi };
    const ar = gi === 1 ? 9 / 16 : 4 / 5;
    // content
    const by = d.by || ['haru.photo', 'av-1', 'H'];
    const head = $('.sns18-lb-head .av');
    head.className = `av ${by[1]}`; head.textContent = by[2];
    $('.sns18-lb-user').textContent = by[0];
    $('.sns18-lb-seal').style.display = by[0] === 'haru.photo' ? '' : 'none';
    $('.sns18-lb-capuser').textContent = by[0];
    $('.sns18-lb-loc').textContent = d.loc;
    $('.sns18-lb-captext').textContent = d.cap;
    $('.sns18-lb-n').textContent = d.likes;
    $('.sns18-lb-like').setAttribute('aria-pressed', 'false');
    $('.sns18-lb-save').setAttribute('aria-pressed', 'false');
    nPages = d.multi ? 3 : 1;
    const variants = ['', 'background-size:260% 220%;background-position:20% 30%;', 'background-size:240% 240%;background-position:85% 80%;'];
    track.innerHTML = Array.from({ length: nPages }, (_, i) => `<div class="sns18-lb-slide art art-${d.a}" style="${artStyle(d)}${variants[i]}"></div>`).join('');
    dots.innerHTML = nPages > 1 ? '<i></i>'.repeat(nPages) : '';
    pages.hidden = nPages < 2;
    const isVideo = !!d.video;
    play.hidden = prog.hidden = dur.hidden = !isVideo;
    setPlaying(false);
    resetProg();
    setPage(0, false);
    // geometry
    const tgt = layoutTarget(ar);
    Object.assign(media.style, { left: tgt.x + 'px', top: tgt.y + 'px', width: tgt.w + 'px', height: tgt.h + 'px', transform: '', clipPath: '' });
    lb.style.removeProperty('--bgo'); lb.style.removeProperty('--uio');
    lb.classList.add('is-open');
    lb.setAttribute('aria-hidden', 'false');
    const f = fromTile(tile, tgt);
    tile.classList.add('is-hidden');
    void lb.offsetWidth;
    lb.classList.add('is-shown');
    if (!reduced()) {
      busy = true;
      anim = media.animate([
        { transform: f.transform, clipPath: f.clip, boxShadow: '0 0 0 rgba(0,0,0,0)' },
        { transform: 'translate3d(0,0,0) scale(1)', clipPath: 'inset(0px 0px 0px 0px round 14px)', boxShadow: '0 20px 50px rgba(0,0,0,.4)' },
      ], { duration: 480, easing: EASE });
      anim.onfinish = () => { busy = false; };
    }
    media.style.clipPath = 'inset(0px 0px 0px 0px round 14px)';
    setTimeout(() => $('.sns18-lb-close').focus({ preventScroll: true }), 30);
  }
  function close(fromTransform) {
    if (!cur || busy) return;
    const { tile } = cur;
    const tgt = { x: parseFloat(media.style.left), y: parseFloat(media.style.top), w: parseFloat(media.style.width), h: parseFloat(media.style.height) };
    // keep the destination tile inside the scroll viewport
    const pr = panels.getBoundingClientRect(), tr = tile.getBoundingClientRect();
    if (tr.top < pr.top) panels.scrollTop -= pr.top - tr.top;
    else if (tr.bottom > pr.bottom) panels.scrollTop += tr.bottom - pr.bottom;
    const f = fromTile(tile, tgt);
    setPlaying(false);
    lb.style.removeProperty('--bgo'); lb.style.removeProperty('--uio');
    lb.classList.remove('is-shown');
    const finish = () => {
      busy = false;
      lb.classList.remove('is-open');
      lb.setAttribute('aria-hidden', 'true');
      tile.classList.remove('is-hidden');
      media.style.transform = '';
      cur = null;
      tile.focus({ preventScroll: true });
    };
    if (reduced()) { finish(); return; }
    busy = true;
    anim = media.animate([
      { transform: fromTransform || 'translate3d(0,0,0) scale(1)', clipPath: 'inset(0px 0px 0px 0px round 14px)' },
      { transform: f.transform, clipPath: f.clip },
    ], { duration: 420, easing: EASE, fill: 'forwards' });
    anim.onfinish = () => { finish(); anim.cancel(); };
  }
  root.addEventListener('click', (e) => {
    const tile = e.target.closest('.sns18-tile');
    if (tile && root.contains(tile)) open(tile);
  });
  $('.sns18-lb-close').addEventListener('click', () => close());
  $('.sns18-lb-bg').addEventListener('click', () => close());
  const progI = prog.firstElementChild;
  let tickT = 0;
  const updDur = () => {
    const a = progI.getAnimations()[0];
    const t = a && a.currentTime ? a.currentTime / 1000 : 0;
    dur.textContent = `0:${String(Math.max(0, Math.ceil(14 - t))).padStart(2, '0')}`;
  };
  function setPlaying(on) {
    media.classList.toggle('is-playing', on);
    play.setAttribute('aria-label', on ? '一時停止' : '再生');
    clearInterval(tickT);
    if (on) tickT = setInterval(updDur, 250);
    updDur();
  }
  const resetProg = () => { progI.style.animation = 'none'; void progI.offsetWidth; progI.style.animation = ''; dur.textContent = '0:14'; };
  progI.addEventListener('animationend', () => { setPlaying(false); resetProg(); });
  play.addEventListener('click', (e) => { e.stopPropagation(); setPlaying(!media.classList.contains('is-playing')); });
  ['.sns18-lb-like', '.sns18-lb-save'].forEach((sel) => $(sel).addEventListener('click', (e) => {
    const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on));
    if (on && !reduced()) b.animate([{ transform: 'scale(.7)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.34,1.56,.64,1)' });
    if (sel === '.sns18-lb-like') {
      const n = $('.sns18-lb-n');
      const v = n.textContent;
      if (/^[\d,]+$/.test(v)) n.textContent = (parseInt(v.replace(/,/g, ''), 10) + (on ? 1 : -1)).toLocaleString('en-US');
    }
  }));
  lb.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowRight' && nPages > 1) { e.preventDefault(); setPage(page + 1); }
    else if (e.key === 'ArrowLeft' && nPages > 1) { e.preventDefault(); setPage(page - 1); }
    else if (e.key === 'Tab') {
      const f = $$('button:not([hidden])', lb);
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  });

  /* — Drag: down to dismiss, sideways to page — */
  let drag = null;
  media.addEventListener('pointerdown', (e) => {
    if (busy || e.button > 0 || e.target.closest('button')) return;
    drag = { x: e.clientX, y: e.clientY, axis: null, id: e.pointerId, t: performance.now() };
    media.setPointerCapture(e.pointerId);
  });
  media.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.axis) {
      if (Math.hypot(dx, dy) < 8) return;
      drag.axis = Math.abs(dx) > Math.abs(dy) && nPages > 1 ? 'x' : 'y';
    }
    if (drag.axis === 'y') {
      const p = Math.min(1, Math.abs(dy) / 320);
      media.style.transform = `translate3d(${dx * .6}px,${dy}px,0) scale(${1 - p * .3})`;
      lb.style.setProperty('--bgo', String(1 - p * .85));
      lb.style.setProperty('--uio', String(Math.max(0, 1 - p * 3)));
      lb.classList.add('is-dragging');
      drag.dx = dx; drag.dy = dy;
    } else {
      const w = media.clientWidth;
      let off = dx;
      if ((page === 0 && dx > 0) || (page === nPages - 1 && dx < 0)) off = dx / 3;
      track.style.transition = 'none';
      track.style.transform = `translate3d(${-page * w + off}px,0,0)`;
      drag.dx = dx;
    }
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    lb.classList.remove('is-dragging');
    if (d.axis === 'y') {
      const v = Math.abs(d.dy) / Math.max(1, performance.now() - d.t);
      if (Math.abs(d.dy) > 110 || v > .7) {
        const t = media.style.transform;
        media.style.transform = '';
        close(t);
      } else {
        media.animate([{ transform: media.style.transform }, { transform: 'translate3d(0,0,0) scale(1)' }], { duration: 380, easing: 'cubic-bezier(.34,1.56,.64,1)' });
        media.style.transform = '';
        lb.style.removeProperty('--bgo'); lb.style.removeProperty('--uio');
      }
    } else if (d.axis === 'x') {
      const w = media.clientWidth;
      setPage(d.dx < -w * .18 ? page + 1 : d.dx > w * .18 ? page - 1 : page);
    } else if (cur && cur.d.video) {
      play.click();
    }
  };
  media.addEventListener('pointerup', endDrag);
  media.addEventListener('pointercancel', endDrag);
})();
</script>

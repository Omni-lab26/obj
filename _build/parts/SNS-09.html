#SNS-09 .sns09-follow { background: var(--s9-coral); color: #fff; box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--s9-coral) 75%, transparent), inset 0 1px 0 rgba(255, 255, 255, .22); }

/* — follow menu — */
#SNS-09 .sns09-menu {

#SNS-09 .sns09-ink { position: absolute; left: 0; bottom: 0; width: calc(100% / 3); height: 3px; display: flex; justify-content: center; pointer-events: none; transition: transform 460ms var(--ease-ios); }

#SNS-09 .sns09-tile .sns09-tr { top: 7px; right: 7px; }
#SNS-09 .sns09-views { position: absolute; left: 7px; bottom: 6px; display: flex; align-items: center; gap: 3px; font: 600 11.5px/1 var(--font-rounded); color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .4); letter-spacing: 0; }

          <div class="sns09-tile art art-8" style="filter: saturate(.7) brightness(1.08)"><svg class="i sns09-tr" aria-hidden="true"><use href="#i-person-crop-circle-fill"/></svg></div>
          <div class="sns09-tile art art-6" style="background-size: 200% 140%; background-position: 70% 40%"><svg class="i sns09-tr" aria-hidden="true"><use href="#i-person-crop-circle-fill"/></svg></div>
          <div class="sns09-tile art art-2" style="filter: hue-rotate(160deg) saturate(.6)"><svg class="i sns09-tr" aria-hidden="true"><use href="#i-person-crop-circle-fill"/></svg></div>
        </div>
      </div>
    </section>
  </div>
  <ul class="obj-notes"><li>フォローで +1</li><li>フォロー中 → メニュー</li><li>タブで切り替え</li><li>ベルで通知オン</li></ul>
</article>
<script>
(() => {
  const root = document.getElementById('SNS-09');
  if (!root) return;
  const reduced = () => !!(window.ObjKit && window.ObjKit.reducedMotion);
  const play = (el, kf, o) => (el && el.animate && !reduced() ? el.animate(kf, o) : null);
  const SPRING = 'cubic-bezier(.34,1.56,.64,1)';

  /* — follow / following + menu — */
  const follow = root.querySelector('.sns09-follow');
  const menu = root.querySelector('.sns09-menu');
  const followers = root.querySelector('.sns09-followers');
  const plus = followers.querySelector('.sns09-plus');
  const num = followers.querySelector('b');
  const f1 = follow.querySelector('.sns09-f1'), f2 = follow.querySelector('.sns09-f2');
  let following = false;
  const base = 124318;

  function setFollowing(on) {
    following = on;
    follow.classList.toggle('is-on', on);
    f1.setAttribute('aria-hidden', String(on));
    f2.setAttribute('aria-hidden', String(!on));
    follow.setAttribute('aria-label', on ? 'フォロー中。オプションを表示' : 'フォローする');
    const n = base + (on ? 1 : 0);
    followers.setAttribute('aria-label', `フォロワー ${n.toLocaleString('ja-JP')}人`);
    if (on) {
      play(follow, [{ transform: 'scale(.95)' }, { transform: 'scale(1.03)', offset: 0.45 }, { transform: 'scale(1)' }], { duration: 460, easing: 'ease-out' });
      plus.textContent = '+1';
      play(plus, [
        { transform: 'translate(-50%, 8px) scale(.6)', opacity: 0 },
        { transform: 'translate(-50%, -16px) scale(1)', opacity: 1, offset: 0.3, easing: 'ease-out' },
        { transform: 'translate(-50%, -20px) scale(1)', opacity: 1, offset: 0.7 },
        { transform: 'translate(-50%, -30px) scale(.9)', opacity: 0 },
      ], { duration: 1100, easing: 'cubic-bezier(.2,.8,.3,1)' });
      play(num, [{ transform: 'scale(1)' }, { transform: 'scale(1.16)', offset: 0.35 }, { transform: 'scale(1)' }], { duration: 640, easing: 'cubic-bezier(.3,.7,.4,1)', delay: 120 });
    } else {
      play(num, [{ transform: 'scale(1)' }, { transform: 'scale(.92)', offset: 0.4 }, { transform: 'scale(1)' }], { duration: 380, easing: 'ease-out' });
    }
  }
  function openMenu(open, focusFirst) {
    menu.classList.toggle('is-open', open);
    follow.setAttribute('aria-expanded', String(open));
    if (open && focusFirst) menu.querySelector('.sns09-mi').focus({ preventScroll: true });
  }
  follow.addEventListener('click', (e) => {
    if (!following) { setFollowing(true); return; }
    openMenu(!menu.classList.contains('is-open'), e.detail === 0);
  });
  menu.addEventListener('click', (e) => {
    const mi = e.target.closest('.sns09-mi');
    if (!mi) return;
    const act = mi.dataset.act;
    if (act === 'unfollow') {
      openMenu(false);
      setFollowing(false);
      menu.querySelectorAll('[aria-checked]').forEach((m) => { m.setAttribute('aria-checked', 'false'); });
      menu.querySelector('[data-act="fav"] use').setAttribute('href', '#i-star');
      follow.focus({ preventScroll: true });
      return;
    }
    const on = mi.getAttribute('aria-checked') !== 'true';
    mi.setAttribute('aria-checked', String(on));
    if (act === 'fav') mi.querySelector('use').setAttribute('href', on ? '#i-star-fill' : '#i-star');
    play(mi.querySelector('.i'), [{ transform: 'scale(.6)' }, { transform: 'scale(1.25)', offset: 0.5 }, { transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' });
    setTimeout(() => { openMenu(false); follow.focus({ preventScroll: true }); }, reduced() ? 0 : 260);
  });
  menu.addEventListener('keydown', (e) => {
    const items = [...menu.querySelectorAll('.sns09-mi')];
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); openMenu(false); follow.focus({ preventScroll: true }); }
    else if (e.key === 'Tab') openMenu(false);
  });
  document.addEventListener('pointerdown', (e) => {
    if (!menu.classList.contains('is-open')) return;
    if (!root.contains(e.target) || (!menu.contains(e.target) && !follow.contains(e.target))) openMenu(false);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && menu.classList.contains('is-open') && !menu.contains(document.activeElement)) openMenu(false); });

  root.querySelector('.sns09-link').addEventListener('click', (e) => e.preventDefault());

  /* — bell — */
  const bell = root.querySelector('.sns09-bell');
  bell.addEventListener('click', () => {
    const on = bell.getAttribute('aria-pressed') !== 'true';
    bell.setAttribute('aria-pressed', String(on));
    if (on) play(bell.querySelector('.i'), [
      { transform: 'rotate(0)' }, { transform: 'rotate(-18deg)', offset: 0.15 }, { transform: 'rotate(15deg)', offset: 0.35 },
      { transform: 'rotate(-9deg)', offset: 0.55 }, { transform: 'rotate(5deg)', offset: 0.75 }, { transform: 'rotate(0)' },
    ], { duration: 650, easing: 'ease-out' });
  });

  /* — tabs — */
  const tabs = [...root.querySelectorAll('.sns09-tab')];
  const grids = [...root.querySelectorAll('.sns09-grid')];
  const ink = root.querySelector('.sns09-ink');
  let cur = 0;
  function select(i, focus) {
    if (i === cur) return;
    const dir = i > cur ? 1 : -1;
    tabs.forEach((t, j) => { t.setAttribute('aria-selected', String(j === i)); t.tabIndex = j === i ? 0 : -1; });
    grids[cur].style.setProperty('--dx', `${-dir * 14}px`);
    grids[i].style.setProperty('--dx', `${dir * 14}px`);
    grids[cur].setAttribute('aria-hidden', 'true');
    void grids[i].offsetWidth;
    grids[i].removeAttribute('aria-hidden');
    ink.style.transform = `translateX(${i * 100}%)`;
    cur = i;
    if (focus) tabs[i].focus({ preventScroll: true });
  }
  tabs.forEach((t, i) => t.addEventListener('click', () => select(i)));
  root.querySelector('.sns09-tabs').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    select((cur + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length, true);
  });
})();
</script>

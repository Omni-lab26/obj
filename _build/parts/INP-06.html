@media (hover: hover) {

<script>
(() => {
  const root = document.getElementById('INP-06');
  root.addEventListener('touchstart', () => {}, { passive: true }); /* enables :active pressed states on iOS Safari */
  const reduced = () => window.ObjKit && ObjKit.reducedMotion;
  const PRICE = 600;
  const yen = (n) => n.toLocaleString('ja-JP');

  /* ── rolling numerals: only the changed digits roll, like SwiftUI .numericText() ── */
  function roller(el) {
    const slots = [];
    const mk = (ch) => {
      const wrap = document.createElement('span'); wrap.className = 'inp06-slot';
      const g = document.createElement('span'); g.className = 'inp06-g'; g.textContent = ch;
      wrap.appendChild(g);
      return { wrap, g, ch };
    };
    el.textContent = '';
    const init = el.dataset.init || '';
    [...init].forEach((c) => { const s = mk(c); slots.push(s); el.appendChild(s.wrap); });
    const ease = 'cubic-bezier(.3, 1.35, .5, 1)';
    return (text, dir) => {
      const chars = [...text];
      const anim = !reduced();
      while (slots.length < chars.length) {        /* grow on the most-significant side */
        const s = mk(''); slots.unshift(s); el.prepend(s.wrap);
        if (anim) s.wrap.animate([{ width: '0px', opacity: 0 }, { width: '0.62em', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.22,1,.36,1)' });
      }
      while (slots.length > chars.length) {
        const s = slots.shift();
        if (anim) {
          s.wrap.style.width = s.wrap.offsetWidth + 'px'; s.wrap.style.overflow = 'visible';
          const a = s.wrap.animate([{ width: s.wrap.offsetWidth + 'px', opacity: 1 }, { width: '0px', opacity: 0 }], { duration: 260, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
          a.onfinish = () => s.wrap.remove();
        } else s.wrap.remove();
      }
      chars.forEach((c, i) => {
        const s = slots[i];
        if (s.ch === c) return;
        s.ch = c;
        /* drop any glyph still on its way out */
        [...s.wrap.querySelectorAll('.inp06-g--abs')].forEach((n) => n.remove());
        const old = s.g;
        const g = document.createElement('span'); g.className = 'inp06-g'; g.textContent = c;
        s.g = g;
        if (!anim || !old.textContent) { old.replaceWith(g); return; }
        old.getAnimations().forEach((a) => a.cancel());
        old.classList.add('inp06-g--abs');
        s.wrap.appendChild(g);
        const d = dir >= 0 ? 1 : -1;
        g.animate([
          { transform: `translateY(${d * 62}%) scale(.86)`, opacity: 0, filter: 'blur(2.5px)' },
          { transform: 'none', opacity: 1, filter: 'blur(0)' },
        ], { duration: 420, easing: ease });
        const out = old.animate([
          { transform: 'none', opacity: 1, filter: 'blur(0)' },
          { transform: `translateY(${-d * 62}%) scale(.86)`, opacity: 0, filter: 'blur(2.5px)' },
        ], { duration: 260, easing: 'cubic-bezier(.4, 0, .9, .6)', fill: 'forwards' });
        out.onfinish = () => old.remove();
      });
    };
  }

  /* ── press & hold auto-repeat (fires once on press, repeats after 400ms, accelerates) ── */
  function holdRepeat(btn, step) {
    let t = 0, n = 0, active = false;
    const stop = () => { active = false; clearTimeout(t); btn.classList.remove('is-down'); };
    const tick = () => {
      if (!active || btn.disabled) return stop();
      step(true); n++;
      t = setTimeout(tick, n < 4 ? 140 : n < 10 ? 90 : 55);
    };
    btn.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || btn.disabled) return;
      active = true; n = 0;
      btn.classList.add('is-down');
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      step(false);
      t = setTimeout(tick, 400);
    });
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('lostpointercapture', stop);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
    /* keyboard (Enter/Space) produces click with detail 0 */
    btn.addEventListener('click', (e) => { if (e.detail === 0) step(false); });
  }

  /* ───── (1) list rows with UIStepper ───── */
  root.querySelectorAll('.inp06-row').forEach((row) => {
    const min = +row.dataset.min, max = +row.dataset.max;
    let v = +row.dataset.val;
    const r = row.querySelector('[data-roll]'); r.dataset.init = String(v);
    const roll = roller(r);
    const [minus, plus] = row.querySelectorAll('.inp06-ios-b');
    const sync = () => { minus.disabled = v <= min; plus.disabled = v >= max; };
    const step = (d) => () => {
      const nv = Math.min(max, Math.max(min, v + d));
      if (nv === v) return;
      v = nv; roll(String(v), d); sync();
    };
    holdRepeat(minus, step(-1)); holdRepeat(plus, step(1));
    sync();
  });

  /* ───── (2)(3) Soft quantity + cart total ───── */
  const card = root.querySelector('.inp06-card');
  const [rbMinus, rbPlus] = card.querySelectorAll('.inp06-rb');
  const qtyBox = card.querySelector('.inp06-qty');
  const rq = card.querySelector('.inp06-qty [data-roll]'); rq.dataset.init = '4';
  const rt = card.querySelector('.inp06-total-v [data-roll]'); rt.dataset.init = yen(4 * PRICE);
  const rollQ = roller(rq), rollT = roller(rt);
  const cta = card.querySelector('.inp06-cta');
  const empty = card.querySelector('.inp06-empty');
  const undo = card.querySelector('.inp06-undo');
  const MAX = 10;
  let q = 4;
  const syncCard = () => {
    const zero = q === 0;
    rbMinus.classList.toggle('is-trash', zero);
    rbMinus.setAttribute('aria-label', zero ? 'カートから削除' : '数量を減らす');
    rbPlus.disabled = q >= MAX;
    qtyBox.classList.toggle('is-zero', zero);
    cta.disabled = zero;
    cta.textContent = zero ? '数量を選択' : `${q}点をカートに追加`;
  };
  const setQ = (nv, d) => {
    nv = Math.max(0, Math.min(MAX, nv));
    if (nv === q) return;
    q = nv; rollQ(String(q), d); rollT(yen(q * PRICE), d); syncCard();
    if (q === MAX && !reduced()) { qtyBox.classList.remove('is-bump'); void qtyBox.offsetWidth; qtyBox.classList.add('is-bump'); }
  };
  holdRepeat(rbMinus, (repeat) => {
    if (q === 0) { if (!repeat) remove(); return; }
    setQ(q - 1, -1);
  });
  holdRepeat(rbPlus, () => setQ(q + 1, 1));
  qtyBox.addEventListener('animationend', () => qtyBox.classList.remove('is-bump'));

  function remove() {
    card.classList.add('is-empty');
    empty.setAttribute('aria-hidden', 'false'); undo.tabIndex = 0;
    setTimeout(() => undo.focus({ preventScroll: true }), 50);
  }
  undo.addEventListener('click', () => {
    card.classList.remove('is-empty');
    empty.setAttribute('aria-hidden', 'true'); undo.tabIndex = -1;
    setTimeout(() => { setQ(1, 1); rbPlus.focus({ preventScroll: true }); }, 180);
  });
  cta.addEventListener('click', () => {
    if (reduced()) return;
    cta.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.03)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  });
  syncCard();
})();
</script>

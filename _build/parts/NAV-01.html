          <button class="nav01-mi" type="button" role="menuitem"><span>選択</span><svg class="i" aria-hidden="true"><use href="#i-checkmark-circle-fill"/></svg></button>
          <button class="nav01-mi" type="button" role="menuitem"><span>並べ替え<small>最近追加した順</small></span><svg class="i" aria-hidden="true"><use href="#i-line-3-horizontal-decrease"/></svg></button>
          <button class="nav01-mi" type="button" role="menuitem"><span>表示オプション</span><svg class="i" aria-hidden="true"><use href="#i-slider-horizontal-3"/></svg></button>
        </div>
      </div>
    </div>
  </div>
  <ul class="obj-notes"><li>画面内をスクロール</li><li>大見出しが小さなタイトルに</li><li>途中で離すとスナップ</li><li>…でメニュー</li></ul>
</article>
<script>
(() => {
  const root = document.getElementById('NAV-01');
  if (!root) return;
  const $ = (s) => root.querySelector(s);
  const scroller = $('.nav01-scroll');
  const bar = $('.nav01-bar');
  const barBg = $('.nav01-bar-bg');
  const compact = $('.nav01-compact');
  const large = $('.nav01-large');
  const kicker = $('.nav01-kicker');
  const title = $('.nav01-title');
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

  /* — Scroll-linked collapse (passive listener + one rAF per frame) — */
  let raf = 0;
  let collapsedY = 60;
  const update = () => {
    raf = 0;
    const y = scroller.scrollTop;
    const barH = bar.offsetHeight;
    const titleBottom = title.offsetTop + title.offsetHeight - barH; // y where the large title has fully slid under the bar
    collapsedY = large.offsetTop + large.offsetHeight - barH;
    kicker.style.opacity = String(1 - ss(0, 20, y));
    title.style.opacity = String(1 - ss(titleBottom - 30, titleBottom - 6, y));
    const c = ss(titleBottom - 12, titleBottom + 2, y);
    compact.style.opacity = String(c);
    compact.style.transform = `translate(-50%, ${((1 - c) * 5).toFixed(2)}px)`;
    barBg.style.opacity = String(ss(collapsedY - 4, collapsedY + 10, y));
  };
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
  scroller.addEventListener('scroll', onScroll, { passive: true });

  /* — Snap the large title fully open / fully collapsed when scrolling stops halfway — */
  let snapT = 0;
  let pointerDown = false;
  const snap = () => {
    if (pointerDown) return;
    const y = scroller.scrollTop;
    if (y > 0.5 && y < collapsedY - 0.5) {
      scroller.scrollTo({ top: y < collapsedY / 2 ? 0 : collapsedY, behavior: ObjKit.reducedMotion ? 'auto' : 'smooth' });
    }
  };
  if ('onscrollend' in window) scroller.addEventListener('scrollend', snap);
  else scroller.addEventListener('scroll', () => { clearTimeout(snapT); snapT = setTimeout(snap, 160); }, { passive: true });
  scroller.addEventListener('pointerdown', () => { pointerDown = true; }, { passive: true });
  scroller.addEventListener('pointerup', () => { pointerDown = false; setTimeout(snap, 60); }, { passive: true });
  scroller.addEventListener('pointercancel', () => { pointerDown = false; }, { passive: true });

  /* — Shelf: mouse drag-to-scroll (touch / trackpad scroll natively) — */
  const shelf = $('.nav01-shelf');
  let drag = null;
  shelf.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { x: e.clientX, left: shelf.scrollLeft, moved: false, id: e.pointerId };
  });
  shelf.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 4) { drag.moved = true; shelf.classList.add('is-drag'); shelf.setPointerCapture(drag.id); }
    if (drag.moved) shelf.scrollLeft = drag.left - dx;
  });
  const endDrag = () => {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    if (!moved) return;
    const left = shelf.scrollLeft;
    shelf.classList.remove('is-drag');
    shelf.scrollLeft = left;
    // nearest snap target, animated
    const step = shelf.querySelector('.nav01-book').offsetWidth + 14;
    shelf.scrollTo({ left: Math.round(left / step) * step, behavior: 'smooth' });
    const kill = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
    shelf.addEventListener('click', kill, { capture: true, once: true });
    setTimeout(() => shelf.removeEventListener('click', kill, { capture: true }), 0);
  };
  shelf.addEventListener('pointerup', endDrag);
  shelf.addEventListener('pointercancel', endDrag);

  /* — Pull-down menu — */
  const moreBtn = $('.nav01-more-btn');
  const menu = $('.nav01-menu');
  const items = [...menu.querySelectorAll('.nav01-mi')];
  const onDocDown = (e) => { if (!menu.contains(e.target) && !moreBtn.contains(e.target)) setMenu(false); };
  const onKey = (e) => {
    if (e.key === 'Escape') { setMenu(false); moreBtn.focus(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const i = items.indexOf(document.activeElement);
      const n = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
      items[n].focus();
    }
  };
  function setMenu(open) {
    if (open === menu.classList.contains('is-open')) return;
    menu.classList.toggle('is-open', open);
    moreBtn.setAttribute('aria-expanded', String(open));
    if (open) {
      document.addEventListener('pointerdown', onDocDown, true);
      root.addEventListener('keydown', onKey);
    } else {
      document.removeEventListener('pointerdown', onDocDown, true);
      root.removeEventListener('keydown', onKey);
    }
  }
  moreBtn.addEventListener('click', () => {
    const open = !menu.classList.contains('is-open');
    setMenu(open);
    if (open && moreBtn.matches(':focus-visible')) requestAnimationFrame(() => items[0].focus());
  });
  items.forEach((it) => it.addEventListener('click', () => { setMenu(false); }));

  /* — Search field: キャンセル slides in while editing — */
  const srow = $('.nav01-searchrow');
  const input = srow.querySelector('input');
  const cancel = srow.querySelector('.nav01-cancel');
  input.addEventListener('focus', () => { srow.classList.add('is-active'); cancel.tabIndex = 0; });
  input.addEventListener('blur', () => { if (!input.value) { srow.classList.remove('is-active'); cancel.tabIndex = -1; } });
  cancel.addEventListener('click', () => { input.value = ''; input.blur(); srow.classList.remove('is-active'); cancel.tabIndex = -1; });
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') cancel.click(); });

  requestAnimationFrame(update);
})();
</script>

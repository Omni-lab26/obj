    N('9月', '9月14日', '『北の夜空』の気になった一節', '「光は、待つ人のところにだけ降りてくる」', 'book', { art: 6 }),
    N('9月', '9月20日', '古い買い物リスト', '牛乳、卵、食パン、バナナ', 'food', { trash: 1 }),
    N('9月', '9月18日', '下書き', '追加テキストなし', 'idea', { trash: 1 }),
    N('9月', '9月15日', '会議メモ（重複）', '1. 先週の振り返り 2. デザインレビュー', 'work', { trash: 1 }),
  ];
  const counts = { all: 128, fav: 12, recent: null, trash: 3, work: 42, trip: 18, food: 24, idea: 31, book: 13 };

  let key = 'all';
  let current = notes[0].id;
  let query = '';

  const pick = (k) => notes.filter((n) => {
    if (k === 'trash') return n.trash;
    if (n.trash) return false;
    if (k === 'all') return true;
    if (k === 'fav') return n.fav;
    if (k === 'recent') return n.g !== '9月';
    return n.f === k;
  });
  const titleOf = (k) => TITLES[k] || FOLDERS[k][0];
  const subOf = (k) => k === 'recent' ? `${pick(k).length}件 · 過去7日間` : k === 'trash' ? `${counts.trash}件 · 30日後に完全に削除` : `${counts[k]}件のメモ`;

  const renderList = () => {
    const q = query.trim().toLowerCase();
    const items = pick(key).filter((n) => !q || (n.title + n.text).toLowerCase().includes(q));
    const showFolder = !FOLDERS[key];
    let html = '', g = '';
    items.forEach((n) => {
      if (n.g !== g) { g = n.g; html += `<div class="nav05-gh" role="presentation">${esc(g)}</div>`; }
      const [fname, fc] = FOLDERS[n.f];
      html += `<button class="nav05-note${n.isNew ? ' is-new' : ''}" type="button" role="option" data-id="${n.id}" aria-selected="${n.id === current}" ${n.id === current ? 'aria-current="true"' : ''} tabindex="${n.id === current ? 0 : -1}">`
        + `<span class="nav05-nt"><b>${esc(n.title)}${n.fav ? '<svg class="i nav05-star" aria-label="お気に入り"><use href="#i-star-fill"/></svg>' : ''}</b>`
        + `<span><time>${esc(n.t)}</time>${esc(n.text)}</span>`
        + (showFolder ? `<small style="--c:${fc}"><svg class="i" aria-hidden="true"><use href="#i-folder-fill"/></svg>${esc(fname)}</small>` : '')
        + `</span>${n.art ? `<span class="nav05-th art art-${n.art}" aria-hidden="true"></span>` : ''}</button>`;
      n.isNew = false;
    });
    if (!items.length) html = q ? `<p class="nav05-empty"><b>結果なし</b>「${esc(query)}」に一致するメモはありません。</p>` : '<p class="nav05-empty"><b>メモはありません</b></p>';
    list.innerHTML = html;
    if (!list.querySelector('[aria-current="true"]')) { const f = list.querySelector('.nav05-note'); if (f) f.tabIndex = 0; }
  };

  /* title in the toolbar: cross-fade with a small vertical slide */
  const setTitle = (dir) => {
    const old = [...ttl.children];
    const el = document.createElement('div');
    el.innerHTML = `<b>${esc(titleOf(key))}</b><small>${esc(subOf(key))}</small>`;
    ttl.appendChild(el);
    if (reduced()) { old.forEach((o) => o.remove()); return; }
    el.animate([{ opacity: 0, transform: `translateY(${8 * dir}px)` }, { opacity: 1, transform: 'none' }], { duration: 320, easing: ease });
    old.forEach((o) => { o.animate([{ opacity: 1 }, { opacity: 0, transform: `translateY(${-8 * dir}px)` }], { duration: 200, easing: ease, fill: 'forwards' }).onfinish = () => o.remove(); });
  };

  const select = (k, row) => {
    if (k === key) { closeOverlay(); return; }
    const from = rows.findIndex((r) => r.dataset.key === key);
    const to = rows.indexOf(row);
    key = k;
    rows.forEach((r) => { const on = r === row; if (on) r.setAttribute('aria-current', 'true'); else r.removeAttribute('aria-current'); });
    const first = pick(k)[0];
    current = first ? first.id : 0;
    setTitle(to > from ? 1 : -1);
    if (reduced()) renderList();
    else {
      list.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: 'ease-out', fill: 'forwards' }).onfinish = () => {
        renderList();
        list.scrollTop = 0;
        bar.classList.remove('is-scrolled');
        list.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: ease });
      };
    }
    setTimeout(closeOverlay, reduced() ? 0 : 160);
  };
  rows.forEach((r) => r.addEventListener('click', () => select(r.dataset.key, r)));

  /* roving focus in the sidebar (↑↓ skip collapsed sections) */
  slist.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const items = [...slist.querySelectorAll('.nav05-sec-h, .nav05-fold:not(.is-closed) .nav05-row')];
    const i = items.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const n = items[Math.min(items.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    rows.forEach((r) => (r.tabIndex = r === n ? 0 : -1));
    n.focus();
  });

  /* collapsible sections */
  $$('.nav05-sec-h').forEach((h) => h.addEventListener('click', () => {
    const open = h.getAttribute('aria-expanded') !== 'true';
    h.setAttribute('aria-expanded', String(open));
    const fold = root.querySelector('#' + h.getAttribute('aria-controls'));
    fold.classList.toggle('is-closed', !open);
    fold.inert = !open;
  }));

  /* list selection + keyboard */
  list.addEventListener('click', (e) => {
    const b = e.target.closest('.nav05-note');
    if (!b) return;
    current = +b.dataset.id;
    list.querySelectorAll('.nav05-note').forEach((x) => {
      const on = x === b;
      x.setAttribute('aria-selected', String(on));
      if (on) x.setAttribute('aria-current', 'true'); else x.removeAttribute('aria-current');
      x.tabIndex = on ? 0 : -1;
    });
  });
  list.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const items = [...list.querySelectorAll('.nav05-note')];
    const i = items.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const n = items[Math.min(items.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    n.focus(); n.click();
  });

  /* focus model: the column you last touched shows the accent selection */
  const focusCol = (inSide) => { side.classList.toggle('is-focus', inSide); main.classList.toggle('is-focus', !inSide); };
  side.addEventListener('pointerdown', () => focusCol(true));
  side.addEventListener('focusin', () => focusCol(true));
  main.addEventListener('pointerdown', (e) => { if (e.target.closest('.nav05-list')) focusCol(false); });
  list.addEventListener('focusin', () => focusCol(false));

  /* sidebar toggle: width collapse when there is room, overlay when narrow */
  const isCompact = () => getComputedStyle(side).position === 'absolute';
  const onKey = (e) => { if (e.key === 'Escape') { closeOverlay(); toggle.focus(); } };
  function closeOverlay() {
    if (!win.classList.contains('is-overlay')) return;
    win.classList.remove('is-overlay');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'サイドバーを表示');
    root.removeEventListener('keydown', onKey);
  }
  toggle.addEventListener('click', () => {
    if (isCompact()) {
      const open = !win.classList.contains('is-overlay');
      if (!open) { closeOverlay(); return; }
      win.classList.add('is-overlay');
      toggle.setAttribute('aria-expanded', 'true');
      toggle.setAttribute('aria-label', 'サイドバーを隠す');
      root.addEventListener('keydown', onKey);
      focusCol(true);
      return;
    }
    const collapsed = win.classList.toggle('is-collapsed');
    side.inert = collapsed;
    toggle.setAttribute('aria-expanded', String(!collapsed));
    toggle.setAttribute('aria-label', collapsed ? 'サイドバーを表示' : 'サイドバーを隠す');
    if (collapsed) focusCol(false);
  });
  scrim.addEventListener('click', closeOverlay);
  /* keep aria/inert in sync when the window crosses the compact breakpoint */
  let wasCompact = null;
  new ResizeObserver(() => {
    const c = isCompact();
    if (c === wasCompact) return;
    wasCompact = c;
    win.classList.remove('is-overlay');
    root.removeEventListener('keydown', onKey);
    const shown = !c && !win.classList.contains('is-collapsed');
    side.inert = !c && win.classList.contains('is-collapsed');
    toggle.setAttribute('aria-expanded', String(shown));
    toggle.setAttribute('aria-label', shown ? 'サイドバーを隠す' : 'サイドバーを表示');
  }).observe(win);

  /* new note */
  $('.nav05-new').addEventListener('click', () => {
    const f = FOLDERS[key] ? key : 'idea';
    const n = N('今日', '9:41', '新規メモ', '追加テキストなし', f, { isNew: !reduced() });
    if (key === 'fav') n.fav = 1;
    if (key === 'trash') { n.trash = 0; }
    notes.unshift(n);
    counts.all++; if (counts[f] != null) counts[f]++;
    if (key === 'fav') counts.fav++;
    rows.forEach((r) => { const c = counts[r.dataset.key]; if (c != null) r.querySelector('em').textContent = c; });
    if (key === 'trash') { select('all', rows[0]); return; }
    current = n.id;
    query = ''; input.value = '';
    renderList();
    list.scrollTop = 0;
    ttl.querySelector('div:last-child small').textContent = subOf(key);
    focusCol(false);
    const el = list.querySelector('[aria-current="true"]'); if (el) el.focus({ preventScroll: true });
  });

  /* search filters the current list */
  input.addEventListener('input', () => { query = input.value; renderList(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape' && input.value) { e.stopPropagation(); input.value = ''; query = ''; renderList(); } });

  /* hairlines appear only when content scrolls under the bars (passive + rAF) */
  let r1 = 0, r2 = 0;
  list.addEventListener('scroll', () => { if (!r1) r1 = requestAnimationFrame(() => { r1 = 0; bar.classList.toggle('is-scrolled', list.scrollTop > 0); }); }, { passive: true });
  slist.addEventListener('scroll', () => { if (!r2) r2 = requestAnimationFrame(() => { r2 = 0; shead.classList.toggle('is-scrolled', slist.scrollTop > 0); }); }, { passive: true });

  renderList();
})();
</script>

                <span class="crd02-cell" data-p=".45"><svg viewBox="0 0 58 58" aria-hidden="true"><circle class="crd02-bt" cx="29" cy="29" r="26"/><circle class="crd02-bp" cx="29" cy="29" r="26"/></svg>
                  <svg class="crd02-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="3.2"/><path d="M9 6.5 9.6 3h4.8l.6 3.5M9 17.5l.6 3.5h4.8l.6-3.5"/></svg>
                  <span class="crd02-bolt"><svg class="i" aria-hidden="true"><use href="#i-bolt-fill"/></svg></span></span>
                <span class="crd02-cell crd02-cell--empty"><svg viewBox="0 0 58 58" aria-hidden="true"><circle class="crd02-bt" cx="29" cy="29" r="26"/></svg></span>
              </span>

          <div class="crd02-slot crd02-slot--m">
            <div class="crd02-w crd02-w--m" role="group" aria-label="リマインダー">
              <span class="crd02-face crd02-rem">
                <span class="crd02-remside">
                  <span class="crd02-remic" aria-hidden="true"><svg class="i"><use href="#i-checkmark"/></svg></span>
                  <span class="crd02-count crd02-num" aria-live="polite">4</span>

                <ul class="crd02-todo">
                  <li><button class="crd02-chk" type="button" role="checkbox" aria-checked="false" aria-label="牛乳とパンを買う"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.4 6.3 2.4 2.4 4.8-5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="crd02-tt">牛乳とパンを買う</span></li>
                  <li><button class="crd02-chk" type="button" role="checkbox" aria-checked="false" aria-label="写真をバックアップ"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.4 6.3 2.4 2.4 4.8-5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="crd02-tt">写真をバックアップ</span></li>

                  <li><button class="crd02-chk" type="button" role="checkbox" aria-checked="false" aria-label="ジムを予約 18:00"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.4 6.3 2.4 2.4 4.8-5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="crd02-tt">ジムを予約 18:00</span></li>

            <button class="crd02-app" type="button"><span class="crd02-ic" style="--g: linear-gradient(160deg, #7FE3A8 0%, #40C8E0 55%, #2E8CF0 100%)"><svg class="i" aria-hidden="true"><use href="#i-location-fill"/></svg></span><span class="crd02-lbl">マップ</span></button>
            <button class="crd02-app" type="button"><span class="crd02-ic crd02-ic--light"><svg class="i" aria-hidden="true"><use href="#i-heart-fill"/></svg></span><span class="crd02-lbl">ヘルスケア</span></button>

<script>
(() => {
  const root = document.getElementById('CRD-02');
  if (!root) return;
  const wrap = root.querySelector('.crd02');
  const reduce = () => window.ObjKit && ObjKit.reducedMotion;

  /* — Continuous-corner (squircle) clip paths, iOS-style corner smoothing — */
  const K = [[1.52866483, 0], ['C', 1.08849323, 0, 0.86840689, 0, 0.66993427, 0.06549600], ['L', 0.63149399, 0.07491100],
    ['C', 0.37282392, 0.16905899, 0.16905899, 0.37282392, 0.07491100, 0.63149399], ['L', 0.06549600, 0.66993427],
    ['C', 0, 0.86840689, 0, 1.08849323, 0, 1.52866483]];
  const squircle = (w, h, r) => {
    r = Math.min(r, Math.min(w, h) / 2 / 1.52866483);
    const corners = [[w, 0, [1, 0], [0, 1]], [w, h, [0, 1], [-1, 0]], [0, h, [-1, 0], [0, -1]], [0, 0, [0, -1], [1, 0]]];
    let d = '';
    corners.forEach(([cx, cy, din, dout], ci) => {
      const P = (X, Y) => `${(cx - din[0] * X * r + dout[0] * Y * r).toFixed(2)} ${(cy - din[1] * X * r + dout[1] * Y * r).toFixed(2)}`;
      K.forEach((seg, i) => {
        if (i === 0) d += (ci === 0 ? 'M' : 'L') + P(seg[0], seg[1]);
        else if (seg[0] === 'L') d += 'L' + P(seg[1], seg[2]);
        else d += 'C' + P(seg[1], seg[2]) + ' ' + P(seg[3], seg[4]) + ' ' + P(seg[5], seg[6]);
      });
    });
    return `path('${d}Z')`;
  };
  root.querySelectorAll('.crd02-face').forEach((f) => {
    const m = f.parentElement.classList.contains('crd02-w--m');
    f.style.clipPath = squircle(m ? 338 : 158, 158, 22); f.style.borderRadius = '0';
  });
  root.querySelectorAll('.crd02-ic').forEach((f) => { f.style.clipPath = squircle(60, 60, 13.5); f.style.borderRadius = '0'; });

  /* — Battery rings — */
  const C26 = 2 * Math.PI * 26;
  root.querySelectorAll('.crd02-cell[data-p] .crd02-bp').forEach((c) => {
    const p = +c.closest('.crd02-cell').dataset.p;
    c.style.strokeDasharray = `${C26}`; c.style.strokeDashoffset = `${C26 * (1 - p)}`;
  });

  /* — Activity rings: draw in when first visible; tap to replay — */
  const arcs = [...root.querySelectorAll('.crd02-arc')];
  arcs.forEach((a) => { const L = 2 * Math.PI * a.r.baseVal.value; a.style.strokeDasharray = `${L}`; a.style.strokeDashoffset = `${L}`; a.dataset.l = L; });
  const fill = (on) => arcs.forEach((a, i) => {
    a.style.transitionDelay = on ? `${i * 0.12}s` : '0s';
    a.style.strokeDashoffset = on ? `${a.dataset.l * (1 - +a.dataset.p)}` : `${a.dataset.l}`;
  });
  let drawn = false;
  const replay = () => {
    if (reduce()) { fill(true); return; }
    arcs.forEach((a) => (a.style.transition = 'none')); fill(false);
    arcs[0].getBoundingClientRect();
    arcs.forEach((a) => (a.style.transition = '')); requestAnimationFrame(() => fill(true));
  };

  /* — Press feedback + long-press jiggle mode — */
  let lpT = 0;
  const jiggle = (on) => {
    wrap.classList.toggle('is-jiggle', on);
    if (on) root.querySelectorAll('.crd02-w, .crd02-app').forEach((el) => el.style.setProperty('--d', `${(-Math.random() * 0.26).toFixed(3)}s`));
  };
  const pressables = root.querySelectorAll('.crd02-w, .crd02-app');
  pressables.forEach((el) => {
    let sx = 0, sy = 0, longFired = false;
    const up = () => { el.classList.remove('is-down'); clearTimeout(lpT); };
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('.crd02-chk')) return;
      sx = e.clientX; sy = e.clientY; longFired = false;
      if (!wrap.classList.contains('is-jiggle')) el.classList.add('is-down');
      clearTimeout(lpT);
      lpT = setTimeout(() => { longFired = true; el.classList.remove('is-down'); jiggle(true); }, 560);
    });
    el.addEventListener('pointermove', (e) => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) up(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => el.addEventListener(t, up));
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    el.addEventListener('click', (e) => {
      if (longFired || wrap.classList.contains('is-jiggle')) { e.preventDefault(); return; }
      if (e.detail === 0) { el.classList.add('is-down'); setTimeout(() => el.classList.remove('is-down'), 140); }
      if (el.hasAttribute('data-rings')) replay();
    });
  });
  root.querySelector('.crd02-done').addEventListener('click', () => jiggle(false));
  root.querySelector('.obj-stage').addEventListener('click', (e) => {
    if (wrap.classList.contains('is-jiggle') && !e.target.closest('.crd02-w, .crd02-app, .crd02-done')) jiggle(false);
  });
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape' && wrap.classList.contains('is-jiggle')) { e.stopPropagation(); jiggle(false); } });

  /* — Reminders: interactive checkboxes — */
  const count = root.querySelector('.crd02-count');
  root.querySelectorAll('.crd02-chk').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    if (wrap.classList.contains('is-jiggle')) return;
    const on = b.getAttribute('aria-checked') !== 'true';
    b.setAttribute('aria-checked', String(on));
    b.closest('li').classList.toggle('is-done', on);
    count.textContent = root.querySelectorAll('.crd02-chk[aria-checked="false"]').length;
    count.classList.add('is-bump'); setTimeout(() => count.classList.remove('is-bump'), 140);
  }));

  /* — Fit the 338pt home-screen pages into narrow cards (true proportions, scaled) — */
  const pages = root.querySelectorAll('.crd02-page');
  const fit = () => {
    const w = wrap.clientWidth;
    const z = Math.min(1, w / 338);
    pages.forEach((p) => (p.style.zoom = z < 1 ? z.toFixed(4) : ''));
  };
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(wrap); else fit();

  /* — Live bits only while visible (photo Ken Burns, first ring draw) — */
  const onVis = (v) => {
    wrap.classList.toggle('is-live', v && !reduce());
    if (v && !drawn) { drawn = true; setTimeout(replay, 120); }
    if (!v) jiggle(false);
  };
  if (window.ObjKit) ObjKit.onVisible(root, onVis); else onVis(true);
})();
</script>

}

#SNS-06 .sns06-big { position: absolute; width: 104px; height: 104px; margin: -56px 0 0 -52px; fill: url(#SNS-06-g-big); overflow: visible; filter: drop-shadow(0 10px 22px rgba(255, 45, 110, .45)); will-change: transform, opacity; }
#SNS-06 .sns06-spot { position: absolute; width: 0; height: 0; }

/* — Reaction cards — */
#SNS-06 .sns06-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
#SNS-06 .sns06-btn {
  --c1: var(--pink);
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
  padding: 14px 0 11px; border: 0; border-radius: 24px; background: var(--bg-grouped-2); color: var(--label);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 16px -10px rgba(0, 0, 0, .14);
  cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform 420ms var(--ease-spring), background-color var(--dur-3) var(--ease-out), box-shadow var(--dur-3) var(--ease-out);
}
#SNS-06 .sns06-btn[data-kind="star"] { --c1: var(--orange); }

#SNS-06 .sns06-p { position: absolute; left: 0; top: 0; will-change: transform, opacity; }

#SNS-06 .sns06-bloom { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 55%, transparent) 0%, color-mix(in srgb, var(--c) 18%, transparent) 55%, transparent 72%); will-change: transform, opacity; }

@media (prefers-reduced-motion: reduce) {

  #SNS-06 .sns06-btn, #SNS-06 .sns06-btn:active { transform: none; }
  #SNS-06 .sns06-hint.is-gone { transform: translateX(-50%); }
}

<script>
(() => {
  const root = document.getElementById('SNS-06');
  if (!root) return;
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = () => !!(window.ObjKit && window.ObjKit.reducedMotion);
  const nf = new Intl.NumberFormat('ja-JP');
  const OUT = 'cubic-bezier(.22,1,.36,1)';
  const SPRING = 'cubic-bezier(.3,1.32,.5,1)';
  const KIND = {
    heart: { colors: ['#FF2D55', '#FF7A9A', '#C25BFF'], mini: 'heart' },
    star: { colors: ['#FFC300', '#FF9500', '#FF6A3D'], mini: 'spark' },
    flame: { colors: ['#FF9F0A', '#FF453A', '#FFC93C'], mini: null, rise: true },
  };
  const play = (el, kf, o) => (el && el.animate ? el.animate(kf, o) : null);
  const after = (a, fn) => (a ? a.finished.then(fn, fn) : fn());

  /* — burst: soft bloom + expanding ring + radial particles — */
  function piece(kind, i, big) {
    const k = KIND[kind];
    const color = k.colors[i % k.colors.length];
    if (big && k.mini) {
      const size = k.mini === 'spark' ? 11 : 10;
      const s = document.createElementNS(NS, 'svg');
      s.setAttribute('viewBox', '0 0 24 24');
      s.setAttribute('class', 'sns06-p');
      s.style.cssText = `width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px;fill:${color}`;
      const u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#SNS-06-' + k.mini);
      s.append(u);
      return s;
    }
    const size = big ? 6.5 : 4.5;
    const d = document.createElement('span');
    d.className = 'sns06-p';
    d.style.cssText = `width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px;border-radius:50%;background:${color}`;
    return d;
  }
  function burst(host, kind, { scale = 1, n = 10, delay = 70 } = {}) {
    const k = KIND[kind];
    const bloom = document.createElement('span');
    bloom.className = 'sns06-bloom';
    bloom.style.setProperty('--c', k.colors[0]);
    const ring = document.createElement('span');
    ring.className = 'sns06-ring';
    ring.style.setProperty('--c', k.colors[1]);
    host.append(bloom, ring);
    after(play(bloom, [{ transform: `scale(${0.25 * scale})`, opacity: 0.9 }, { transform: `scale(${1.15 * scale})`, opacity: 0 }], { duration: 520, delay, easing: OUT, fill: 'both' }), () => bloom.remove());
    after(play(ring, [
      { transform: `scale(${0.4 * scale})`, opacity: 0 },
      { transform: `scale(${0.75 * scale})`, opacity: 1, offset: 0.18 },
      { transform: `scale(${1.55 * scale})`, opacity: 0 },
    ], { duration: 600, delay, easing: OUT, fill: 'both' }), () => ring.remove());

    const base = Math.random() * 360;
    for (let i = 0; i < n; i++) {
      const big = i % 2 === 0;
      let ang = base + (i / n) * 360 + (Math.random() * 14 - 7);
      if (k.rise) ang = -90 + ((i + 0.5) / n - 0.5) * 230 + (Math.random() * 12 - 6);
      const rad = (ang * Math.PI) / 180;
      const r0 = 20 * scale;
      const r1 = (big ? 50 : 36) * scale * (0.9 + Math.random() * 0.22);
      const x0 = Math.cos(rad) * r0, y0 = Math.sin(rad) * r0;
      const x1 = Math.cos(rad) * r1, y1 = Math.sin(rad) * r1 - (k.rise ? 12 * scale : 0);
      const rot = Math.random() * 90 - 45;
      const p = piece(kind, i, big);
      host.append(p);
      after(play(p, [
        { transform: `translate(${x0}px,${y0}px) scale(.3) rotate(0deg)`, opacity: 0, easing: 'cubic-bezier(.15,.85,.35,1)' },
        { transform: `translate(${x0 + (x1 - x0) * 0.78}px,${y0 + (y1 - y0) * 0.78}px) scale(1) rotate(${rot * 0.6}deg)`, opacity: 1, offset: 0.36, easing: 'cubic-bezier(.3,.6,.45,1)' },
        { transform: `translate(${x1}px,${y1}px) scale(.2) rotate(${rot}deg)`, opacity: 0 },
      ], { duration: 720 + Math.random() * 160, delay: delay + (big ? 0 : 35), fill: 'both' }), () => p.remove());
    }
  }

  /* — vertical digit roll — */
  function roll(el, from, to, dir) {
    const a = nf.format(from), b = nf.format(to);
    const token = (el._t = (el._t || 0) + 1);
    if (reduced() || !el.animate) {
      el.textContent = b;
      play(el, [{ opacity: 0.2 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
      return;
    }
    const len = Math.max(a.length, b.length);
    const A = a.padStart(len, ' '), B = b.padStart(len, ' ');
    el.textContent = '';
    const anims = [];
    let k = 0;
    const cells = [];
    for (let i = 0; i < len; i++) {
      const cell = document.createElement('span');
      cell.className = 'sns06-d';
      if (A[i] === B[i]) cell.textContent = B[i];
      else {
        cell.classList.add('sns06-d--roll');
        const col = document.createElement('span');
        col.className = 'sns06-col';
        const o = document.createElement('span'); o.textContent = A[i];
        const nw = document.createElement('span'); nw.textContent = B[i];
        if (dir > 0) col.append(o, nw); else col.append(nw, o);
        cell.append(col);
        cells.push(col);
      }
      el.append(cell);
    }
    for (let j = cells.length - 1; j >= 0; j--) {
      const col = cells[j];
      const kf = dir > 0 ? [{ transform: 'translateY(0)' }, { transform: 'translateY(-22px)' }] : [{ transform: 'translateY(-22px)' }, { transform: 'translateY(0)' }];
      anims.push(play(col, kf, { duration: 520, delay: 40 + k * 45, easing: SPRING, fill: 'both' }));
      k++;
    }
    Promise.all(anims.map((x) => x.finished)).then(() => { if (el._t === token) el.textContent = b; }, () => {});
  }

  /* — reaction buttons — */
  const POP = {
    heart: [
      { transform: 'scale(1)', easing: 'cubic-bezier(.4,0,.7,1)' },
      { transform: 'scale(.6)', offset: 0.16, easing: 'cubic-bezier(.2,.9,.35,1)' },
      { transform: 'scale(1.25)', offset: 0.5, easing: 'cubic-bezier(.45,0,.4,1)' },
      { transform: 'scale(.95)', offset: 0.76, easing: 'ease-in-out' },
      { transform: 'scale(1)' },
    ],
    star: [
      { transform: 'scale(1) rotate(0deg)', easing: 'cubic-bezier(.4,0,.7,1)' },
      { transform: 'scale(.6) rotate(-28deg)', offset: 0.16, easing: 'cubic-bezier(.2,.9,.35,1)' },
      { transform: 'scale(1.25) rotate(10deg)', offset: 0.5, easing: 'cubic-bezier(.45,0,.4,1)' },
      { transform: 'scale(.95) rotate(-3deg)', offset: 0.76, easing: 'ease-in-out' },
      { transform: 'scale(1) rotate(0deg)' },
    ],
    flame: [
      { transform: 'scale(1, 1)', easing: 'cubic-bezier(.4,0,.7,1)' },
      { transform: 'scale(.66, .55)', offset: 0.16, easing: 'cubic-bezier(.2,.9,.35,1)' },
      { transform: 'scale(1.12, 1.3)', offset: 0.48, easing: 'cubic-bezier(.45,0,.4,1)' },
      { transform: 'scale(.97, .93)', offset: 0.72, easing: 'ease-in-out' },
      { transform: 'scale(1.01, 1.03)', offset: 0.88 },
      { transform: 'scale(1, 1)' },
    ],
  };
  const btns = [...root.querySelectorAll('.sns06-btn')];
  const state = new Map();
  btns.forEach((b) => {
    const st = { on: false, n: +b.dataset.n, label: b.dataset.label, kind: b.dataset.kind, count: b.querySelector('.sns06-count') };
    state.set(b, st);
    b.setAttribute('aria-label', `${st.label} ${nf.format(st.n)}件`);
    b.addEventListener('click', () => setOn(b, !st.on));
  });

  function setOn(b, on) {
    const st = state.get(b);
    if (st.on === on) return false;
    st.on = on;
    const from = st.n;
    st.n += on ? 1 : -1;
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', `${st.label} ${nf.format(st.n)}件`);
    roll(st.count, from, st.n, on ? 1 : -1);
    if (reduced()) return true;
    const ico = b.querySelector('.sns06-ico');
    const fill = b.querySelector('.sns06-f');
    ico.getAnimations().forEach((x) => x.cancel());
    fill.getAnimations().forEach((x) => x.cancel());
    if (on) {
      play(ico, POP[st.kind], { duration: 700 });
      play(fill, [
        { transform: 'scale(.35)', opacity: 0 },
        { transform: 'scale(.6)', opacity: 1, offset: 0.16 },
        { transform: 'scale(1)', opacity: 1 },
      ], { duration: 420, easing: OUT });
      burst(b.querySelector('.sns06-fx'), st.kind);
    } else {
      play(ico, [{ transform: 'scale(1)' }, { transform: 'scale(.84)', offset: 0.35 }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.3,.7,.4,1)' });
      play(fill, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.45)', opacity: 0 }], { duration: 240, easing: 'cubic-bezier(.4,0,1,1)' });
    }
    return true;
  }

  /* — double-tap photo — */
  const tile = root.querySelector('.sns06-tile');
  const layer = root.querySelector('.sns06-layer');
  const hint = root.querySelector('.sns06-hint');
  const heartBtn = root.querySelector('.sns06-btn[data-kind="heart"]');
  let lastT = -1e9, lx = 0, ly = 0;

  function bigHeart(x, y) {
    hint.classList.add('is-gone');
    setOn(heartBtn, true);
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'sns06-big');
    const u = document.createElementNS(NS, 'use');
    u.setAttribute('href', '#SNS-06-heart');
    s.append(u);
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    layer.append(s);
    if (reduced() || !s.animate) {
      after(play(s, [{ opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 1, offset: 0.7 }, { opacity: 0 }], { duration: 900, fill: 'both' }), () => s.remove());
      return;
    }
    const r = Math.random() * 26 - 13;
    after(play(s, [
      { transform: `rotate(${r}deg) scale(0)`, opacity: 0, easing: 'cubic-bezier(.2,.9,.3,1)' },
      { transform: `rotate(${r}deg) scale(1.22)`, opacity: 1, offset: 0.14, easing: 'ease-in-out' },
      { transform: `rotate(${r}deg) scale(.9)`, offset: 0.25, easing: 'ease-in-out' },
      { transform: `rotate(${r}deg) scale(1.03)`, offset: 0.36, easing: 'ease-in-out' },
      { transform: `rotate(${r}deg) scale(1)`, opacity: 1, offset: 0.66, easing: 'cubic-bezier(.5,0,.75,0)' },
      { transform: `translateY(-96px) rotate(${r * 1.6}deg) scale(.7)`, opacity: 0 },
    ], { duration: 1200, fill: 'both' }), () => s.remove());
    const spot = document.createElement('span');
    spot.className = 'sns06-spot';
    spot.style.left = x + 'px';
    spot.style.top = y + 'px';
    layer.append(spot);
    burst(spot, 'heart', { scale: 1.75, n: 8, delay: 90 });
    setTimeout(() => spot.remove(), 1200);
  }

  tile.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const r = tile.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (e.timeStamp - lastT < 340 && Math.hypot(x - lx, y - ly) < 48) bigHeart(x, y);
    lastT = e.timeStamp; lx = x; ly = y;
  });
  tile.addEventListener('dblclick', (e) => e.preventDefault());
  tile.addEventListener('contextmenu', (e) => { if (e.pointerType !== 'mouse') e.preventDefault(); });
  tile.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    if (e.repeat) return;
    const r = tile.getBoundingClientRect();
    bigHeart(r.width / 2, r.height / 2);
  });
})();
</script>

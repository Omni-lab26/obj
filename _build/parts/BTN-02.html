<!-- ═══════════ BTN-02 · Tinted Button ═══════════ -->
<style>
#BTN-02 { --btn02-font: ui-rounded, var(--font-text); }
#BTN-02 .btn02-stack { display: flex; flex-direction: column; align-items: stretch; gap: 24px; width: min(100%, 340px); }
#BTN-02 .btn02-group { display: flex; flex-direction: column; gap: 10px; }
#BTN-02 .btn02-cap {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 4px;
  font: 500 var(--fs-caption1)/16px var(--font-text); color: var(--label-2); letter-spacing: 0;
}
#BTN-02 .btn02-meta { font: 500 10.5px/16px var(--font-mono); color: var(--label-3); letter-spacing: .02em; }

/* — Tinted button (shared recipe) —
   bg = colour at 15% (light) / 22% (dark), label = the colour (nudged darker in light mode for legibility) */
#BTN-02 .btn02 {
  --c: var(--accent);
  --tint: light-dark(color-mix(in srgb, var(--c) 15%, transparent), color-mix(in srgb, var(--c) 22%, transparent));
  --tint-press: light-dark(color-mix(in srgb, var(--c) 24%, transparent), color-mix(in srgb, var(--c) 32%, transparent));
  --ink: light-dark(color-mix(in oklab, var(--c) 84%, #000), color-mix(in oklab, var(--c) 84%, #fff));
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 20px; border: 0; border-radius: 16px;
  background-color: var(--tint); color: var(--ink);
  font: 600 var(--fs-callout)/1 var(--btn02-font); letter-spacing: 0; white-space: nowrap;
  cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  outline: 3px solid transparent; outline-offset: 5px;
  transition:
    transform var(--dur-3) var(--ease-spring),
    background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out), box-shadow var(--dur-3) var(--ease-out),
    outline-color var(--dur-1) ease, outline-offset var(--dur-2) var(--ease-out);
}
#BTN-02 .btn02 .i { font-size: 1.06em; }
@media (hover: hover) {
  #BTN-02 .btn02:hover { background-color: color-mix(in srgb, var(--tint) 70%, var(--tint-press)); }
}
#BTN-02 .btn02:active {
  transform: scale(.96); background-color: var(--tint-press);
  transition: transform 120ms var(--ease-out), background-color 80ms ease, color var(--dur-2) ease, box-shadow var(--dur-2) ease;
}
#BTN-02 .btn02:focus-visible { outline-color: light-dark(color-mix(in srgb, var(--c) 40%, transparent), color-mix(in srgb, var(--c) 65%, transparent)); outline-offset: 2px; }

/* — Palette chips (toggle to filled) — */
#BTN-02 .btn02-palette { display: flex; flex-wrap: wrap; gap: 8px; }
#BTN-02 .btn02--chip { height: 36px; padding: 0 15px 0 12px; border-radius: 18px; font-size: var(--fs-subhead); gap: 5px; }
#BTN-02 .btn02--chip .i { font-size: 15px; }
#BTN-02 .btn02-ico { display: inline-flex; }
#BTN-02 .btn02--chip[aria-pressed="true"] {
  background-color: var(--c); color: #fff;
  box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--c) 75%, transparent), inset 0 .5px 0 rgba(255, 255, 255, .3);
}
@media (hover: hover) {
  #BTN-02 .btn02--chip[aria-pressed="true"]:hover { background-color: color-mix(in srgb, var(--c) 90%, #fff); }
}
#BTN-02 .btn02--chip[aria-pressed="true"]:active { background-color: color-mix(in srgb, var(--c) 86%, #000); }
#BTN-02 .btn02-ico.is-pop { animation: btn02-pop 520ms var(--ease-out); }

/* — Large, full width — */
#BTN-02 .btn02--l { width: 100%; height: 52px; border-radius: 18px; font-size: var(--fs-headline); gap: 8px; }
#BTN-02 .btn02--l .i { font-size: 19px; }
/* two complete faces (icon + label) stacked in one cell → each stays optically centred */
#BTN-02 .btn02-l-faces { display: grid; place-items: center; }
#BTN-02 .btn02-l-face {
  grid-area: 1 / 1; display: inline-flex; align-items: center; gap: 8px;
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-3) var(--ease-spring), filter var(--dur-2) ease;
}
#BTN-02 .btn02-l-face + .btn02-l-face { opacity: 0; transform: translateY(8px) scale(.96); filter: blur(3px); }
#BTN-02 .btn02--l.is-done .btn02-l-face:first-child { opacity: 0; transform: translateY(-8px) scale(.96); filter: blur(3px); }
#BTN-02 .btn02--l.is-done .btn02-l-face + .btn02-l-face { opacity: 1; transform: none; filter: none; }
#BTN-02 .btn02--l.is-done .btn02-l-face + .btn02-l-face .i { animation: btn02-pop 520ms var(--ease-out); }

/* — Context card with the side-by-side pair — */
#BTN-02 .btn02-card {
  display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 26px;
  /* Soft: the surface carries a whisper of the card's tint instead of flat white */
  background: linear-gradient(180deg, color-mix(in srgb, var(--teal) 8%, var(--bg-grouped-2)) 0%, var(--bg-grouped-2) 62%);
  box-shadow: 0 0 0 .5px light-dark(rgba(0, 0, 0, .04), rgba(255, 255, 255, .07)), 0 12px 32px -14px light-dark(rgba(60, 50, 120, .22), rgba(0, 0, 0, .6)), 0 2px 6px -2px light-dark(rgba(60, 50, 120, .08), rgba(0, 0, 0, .4));
}
#BTN-02 .btn02-head { display: flex; align-items: center; gap: 14px; min-width: 0; }
#BTN-02 .btn02-thumb { width: 56px; height: 56px; border-radius: 18px; flex: none; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .06); background-size: 160% 160%; background-position: 30% 30%; }
#BTN-02 .btn02-text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
#BTN-02 .btn02-eyebrow { font: 600 var(--fs-caption1)/16px var(--btn02-font); color: light-dark(color-mix(in oklab, var(--teal) 80%, #000), var(--teal)); letter-spacing: 0; }
#BTN-02 .btn02-eyebrow b { font-weight: 600; font-variant-numeric: tabular-nums; }
#BTN-02 .btn02-title { margin: 0; font: 600 var(--fs-headline)/22px var(--font-text); color: var(--label); letter-spacing: 0; word-break: auto-phrase; text-wrap: balance; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
#BTN-02 .btn02-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#BTN-02 .btn02-pair .btn02 { --c: var(--teal); width: 100%; }

@keyframes btn02-pop {
  0% { transform: scale(1); }
  25% { transform: scale(.7); }
  60% { transform: scale(1.22) rotate(-6deg); }
  82% { transform: scale(.96); }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  #BTN-02 .btn02, #BTN-02 .btn02:active { transform: none; transition: background-color var(--dur-2) ease, color var(--dur-2) ease, outline-color var(--dur-1) ease; }
  #BTN-02 .btn02-ico.is-pop { animation: none; }
  #BTN-02 .btn02-l-face { transform: none !important; filter: none !important; transition: opacity var(--dur-2) ease; }
  #BTN-02 .btn02--l.is-done .btn02-l-face .i { animation: none; }
}
</style>
<article class="obj" id="BTN-02" data-name="Tinted Button" data-ja="ティントボタン" data-vector="Soft" data-size="m" data-desc="薄い色面で控えめに強調。複数カラーのパレット付き。">
  <div class="obj-stage" data-bg="grouped">
    <div class="btn02-stack">
      <div class="btn02-group">
        <p class="btn02-cap"><span>パレット・タップで選択</span><span class="btn02-meta">15% · 22%</span></p>
        <div class="btn02-palette" role="group" aria-label="カラーパレット">
          <button class="btn02 btn02--chip" type="button" aria-pressed="false" style="--c: var(--blue)"><span class="btn02-ico"><svg class="i" aria-hidden="true"><use href="#i-bell-fill"/></svg></span>通知</button>
          <button class="btn02 btn02--chip" type="button" aria-pressed="false" style="--c: var(--green)"><span class="btn02-ico"><svg class="i" aria-hidden="true"><use href="#i-bookmark-fill"/></svg></span>保存</button>
          <button class="btn02 btn02--chip" type="button" aria-pressed="false" style="--c: var(--orange)"><span class="btn02-ico"><svg class="i" aria-hidden="true"><use href="#i-star-fill"/></svg></span>スター</button>
          <button class="btn02 btn02--chip" type="button" aria-pressed="true" style="--c: var(--pink)"><span class="btn02-ico"><svg class="i" aria-hidden="true"><use href="#i-heart-fill"/></svg></span>お気に入り</button>
          <button class="btn02 btn02--chip" type="button" aria-pressed="false" style="--c: var(--purple)"><span class="btn02-ico"><svg class="i" aria-hidden="true"><use href="#i-sparkles"/></svg></span>おすすめ</button>
        </div>
      </div>

      <div class="btn02-group">
        <p class="btn02-cap"><span>Large・全幅</span><span class="btn02-meta">52pt · R18</span></p>
        <button class="btn02 btn02--l" type="button" style="--c: var(--indigo)" aria-label="カレンダーに追加">
          <span class="btn02-l-faces" aria-hidden="true">
            <span class="btn02-l-face"><svg class="i"><use href="#i-calendar"/></svg>カレンダーに追加</span>
            <span class="btn02-l-face"><svg class="i"><use href="#i-checkmark"/></svg>追加しました</span>
          </span>
        </button>
      </div>

      <div class="btn02-group">
        <p class="btn02-cap"><span>ペア</span><span class="btn02-meta">44pt · R16</span></p>
        <div class="btn02-card">
          <div class="btn02-head">
            <div class="btn02-thumb art art-7" aria-hidden="true"></div>
            <div class="btn02-text">
              <span class="btn02-eyebrow">デザイン・<b>5</b>分で読める</span>
              <p class="btn02-title">色を「やさしく」使う5つのコツ</p>
            </div>
          </div>
          <div class="btn02-pair">
            <button class="btn02" type="button">あとで</button>
            <button class="btn02" type="button">今すぐ読む</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <ul class="obj-notes"><li>色のボタンで選択⇄解除</li><li>押すとやさしく沈む</li><li>大ボタンで追加完了</li></ul>
</article>
<script>
(() => {
  const root = document.getElementById('BTN-02');
  root.addEventListener('touchstart', () => {}, { passive: true });

  const pop = (el) => {
    if (!el || ObjKit.reducedMotion) return;
    el.classList.remove('is-pop');
    void el.offsetWidth;
    el.classList.add('is-pop');
  };
  root.addEventListener('animationend', (e) => {
    if (e.target.classList && e.target.classList.contains('btn02-ico')) e.target.classList.remove('is-pop');
  });

  // Palette: tinted ⇄ filled (selected) state
  root.querySelectorAll('.btn02--chip').forEach((b) => {
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      if (on) pop(b.querySelector('.btn02-ico'));
    });
  });

  // Large: calendar → "追加しました", returns after a moment
  const big = root.querySelector('.btn02--l');
  let t;
  big.addEventListener('click', () => {
    clearTimeout(t);
    const done = !big.classList.contains('is-done');
    big.classList.toggle('is-done', done);
    big.setAttribute('aria-label', done ? '追加しました' : 'カレンダーに追加');
    if (done) t = setTimeout(() => { big.classList.remove('is-done'); big.setAttribute('aria-label', 'カレンダーに追加'); }, 2200);
  });
})();
</script>

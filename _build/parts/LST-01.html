<!-- ═══════════ LST-01 · Grouped List ═══════════ -->
<style>
#LST-01 .lst01 { width: min(100%, 360px); display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }
#LST-01 .lst01-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* — Section header / footer — */
#LST-01 .lst01-head { margin: 0; padding: 0 16px 7px; font-size: var(--fs-footnote); line-height: 18px; font-weight: 400; color: var(--label-2); letter-spacing: 0; }
#LST-01 .lst01-foot { margin: 0; padding: 7px 16px 0; font-size: var(--fs-footnote); line-height: 18px; color: var(--label-2); letter-spacing: 0; text-wrap: pretty; }
#LST-01 .lst01-sec { margin-top: 35px; }
#LST-01 .lst01-sec:first-child { margin-top: 0; }
#LST-01 .lst01-sec--head { margin-top: 22px; }

/* — Inset grouped container — */
#LST-01 .lst01-group { margin: 0; padding: 0; list-style: none; background: var(--bg-grouped-2); border-radius: 12px; overflow: hidden; }
#LST-01 .lst01-group > li { display: block; }

/* — Row — */
#LST-01 .lst01-row {
  position: relative; display: flex; align-items: center; width: 100%; min-height: 44px; margin: 0; padding: 0 0 0 16px;
  border: 0; border-radius: 0; background-color: transparent; color: var(--label); text-align: left;
  font: inherit; cursor: default; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  transition: background-color .42s ease;
}
#LST-01 button.lst01-row { cursor: pointer; }
#LST-01 .lst01-row.is-pressed { background-color: var(--gray4); transition: none; }
#LST-01 .lst01-row:focus-visible { outline: none; background-color: color-mix(in srgb, var(--accent) 14%, transparent); }

#LST-01 .lst01-ic {
  position: relative; flex: none; width: 29px; height: 29px; border-radius: 7px; margin-right: 15px;
  display: grid; place-items: center; color: #fff; background: var(--c);
  box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .06);
}
#LST-01 .lst01-ic::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, .05)); pointer-events: none; }
#LST-01 .lst01-ic .i, #LST-01 .lst01-ic svg { width: 19px; height: 19px; position: relative; z-index: 1; }
#LST-01 .lst01-ic .lst01-ic-sm { width: 17px; height: 17px; }

#LST-01 .lst01-body {
  flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 11px 16px 11px 0; box-shadow: inset 0 -.5px 0 var(--separator);
}
#LST-01 .lst01-group > li:last-child .lst01-body { box-shadow: none; }
#LST-01 .lst01-row.is-pressed .lst01-body,
#LST-01 .lst01-group > li:has(+ li > .lst01-row.is-pressed) .lst01-body { box-shadow: none; }

#LST-01 .lst01-title { flex: 1; min-width: 0; font-size: var(--fs-body); line-height: 22px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#LST-01 .lst01-latin { letter-spacing: -0.41px; }
#LST-01 .lst01-detail {
  flex: none; max-width: 52%; font-size: var(--fs-body); line-height: 22px; color: var(--label-2); letter-spacing: -0.2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .16s ease, transform .16s ease;
}
#LST-01 .lst01-detail.is-swap { opacity: 0; transform: translateY(2px); }
#LST-01 .lst01-chev { flex: none; width: 8px; height: 14px; margin-left: 2px; color: var(--gray3); }
#LST-01 .lst01-badge {
  flex: none; min-width: 23px; height: 23px; padding: 0 7px; border-radius: 12px; display: grid; place-items: center;
  background: var(--red); color: #fff; font: 500 15px/1 var(--font-text); letter-spacing: 0; font-variant-numeric: tabular-nums;
}

/* — Profile cell — */
#LST-01 .lst01-row--profile { min-height: 80px; padding-left: 16px; }
#LST-01 .lst01-row--profile .lst01-body { padding-top: 10px; padding-bottom: 10px; box-shadow: none; }
#LST-01 .lst01-av { width: 60px; height: 60px; font-size: 25px; margin-right: 14px; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .06); }
#LST-01 .lst01-who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
#LST-01 .lst01-name { font: 400 22px/26px var(--font-display); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#LST-01 .lst01-sub { font-size: var(--fs-footnote); line-height: 17px; color: var(--label); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* — Switch 51×31 — */
#LST-01 .lst01-switch {
  position: relative; flex: none; width: 51px; height: 31px; margin: -2px 0; padding: 0; border: 0; border-radius: 16px;
  background: var(--fill); cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: background-color .25s ease;
}
#LST-01 .lst01-switch[aria-checked="true"] { background: var(--green); }
#LST-01 .lst01-knob {
  position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 3px 1px rgba(0, 0, 0, .06), 0 0 0 .5px rgba(0, 0, 0, .04);
  transition: transform .34s cubic-bezier(.3, 1.3, .55, 1), width .22s var(--ease-out);
}
#LST-01 .lst01-switch[aria-checked="true"] .lst01-knob { transform: translateX(20px); }
#LST-01 .lst01-switch.is-down .lst01-knob { width: 33px; }
#LST-01 .lst01-switch.is-down[aria-checked="true"] .lst01-knob { transform: translateX(14px); }
#LST-01 .lst01-switch:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg-grouped-2), 0 0 0 4.5px color-mix(in srgb, var(--accent) 50%, transparent); }

@media (prefers-reduced-motion: reduce) {
  #LST-01 .lst01-knob, #LST-01 .lst01-detail, #LST-01 .lst01-row { transition: none; }
}
</style>

<script>
(() => {
  const root = document.getElementById('LST-01');
  if (!root) return;
  const reduce = () => window.ObjKit && ObjKit.reducedMotion;

  /* — Row highlight: instant on press, iOS-like fade on release; delayed for touch so scrolling doesn't flash — */
  let active = null, delayT = 0, sx = 0, sy = 0;
  const on = (row) => { row.classList.add('is-pressed'); };
  const off = (row) => { if (row) row.classList.remove('is-pressed'); };
  const flash = (row) => { on(row); setTimeout(() => off(row), 110); };
  root.querySelectorAll('button.lst01-row').forEach((row) => {
    row.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      active = row; sx = e.clientX; sy = e.clientY;
      clearTimeout(delayT);
      if (e.pointerType === 'touch') delayT = setTimeout(() => { if (active === row) on(row); }, 70);
      else on(row);
    });
    row.addEventListener('pointermove', (e) => {
      if (active === row && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) { clearTimeout(delayT); off(row); active = null; }
    });
    row.addEventListener('pointerup', () => {
      if (active !== row) return;
      clearTimeout(delayT);
      if (!row.classList.contains('is-pressed')) flash(row);
      else requestAnimationFrame(() => setTimeout(() => off(row), 60));
      active = null;
    });
    ['pointercancel', 'pointerleave'].forEach((t) => row.addEventListener(t, () => { if (active === row) { clearTimeout(delayT); off(row); active = null; } }));
    row.addEventListener('click', (e) => { if (e.detail === 0) flash(row); });
  });

  /* — Airplane mode switch — */
  const sw = root.querySelector('.lst01-switch');
  const wifi = root.querySelector('[data-k="wifi"]');
  const cell = root.querySelector('[data-k="cell"]');
  const swap = (el, text) => {
    if (el.textContent === text) return;
    if (reduce()) { el.textContent = text; return; }
    el.classList.add('is-swap');
    setTimeout(() => { el.textContent = text; el.classList.remove('is-swap'); }, 150);
  };
  const down = () => sw.classList.add('is-down');
  const up = () => sw.classList.remove('is-down');
  sw.addEventListener('pointerdown', (e) => { if (e.button === 0) down(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => sw.addEventListener(t, up));
  sw.addEventListener('click', () => {
    const v = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', String(v));
    swap(wifi, v ? 'オフ' : 'Home-5G');
    swap(cell, v ? '機内モード' : '');
  });
})();
</script>

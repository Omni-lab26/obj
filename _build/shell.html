<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Noto+Sans+JP:wght@300..800&display=swap">
<script>
/* Theme is applied before first paint to avoid a flash. */
(() => {
  try {
    const t = localStorage.getItem('objcat-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
/* Lets iOS Safari apply :active pressed states everywhere. */
document.addEventListener('touchstart', () => {}, { passive: true });
/* ObjKit — tiny shared helpers available to every object script. */
window.ObjKit = (() => {
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  const subs = new Map();
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) (subs.get(e.target) || []).forEach((cb) => cb(e.isIntersecting));
  }, { rootMargin: '120px' });
  return {
    /** true when the user prefers reduced motion */
    get reducedMotion() { return mq.matches; },
    /** cb(isVisible) whenever el enters/leaves the viewport — pause loops when hidden */
    onVisible(el, cb) {
      if (!subs.has(el)) { subs.set(el, []); io.observe(el); }
      subs.get(el).push(cb);
    },
  };
})();
</script>

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 24px; }
body {
  margin: 0;
  background: var(--page);
  color: var(--label);
  font: 400 var(--fs-body)/1.29 var(--font-text);
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
img, svg { display: block; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* — Icons: <svg class="i"><use href="#i-heart"/></svg> — size with font-size or width/height — */
.i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; overflow: visible; fill: currentColor; }

/* — Glass utility (Liquid-glass-like material) — */
.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-shadow), var(--glass-edge);
}
.wallpaper { background: var(--wallpaper); }

/* — iPhone frame: <div class="phone"><div class="phone-screen">…</div></div> —
     status bar / Dynamic Island / home indicator are injected automatically.
     Content should leave var(--phone-safe-top) at the top and var(--phone-safe-bottom) at the bottom. */
.phone {
  --phone-w: 340px; --phone-h: 700px; --phone-safe-top: 54px; --phone-safe-bottom: 28px;
  position: relative; flex: none;
  width: var(--phone-w); height: var(--phone-h); max-width: 100%;
  padding: 9px; border-radius: 54px;
  background: linear-gradient(150deg, #4a4a4e 0%, #1d1d1f 22%, #2b2b2e 60%, #121214 100%);
  box-shadow:
    inset 0 0 0 1.5px rgba(255, 255, 255, .14),
    inset 0 0 0 3px #0b0b0c,
    0 0 0 1px rgba(0, 0, 0, .55),
    0 40px 70px -28px rgba(0, 0, 0, .55),
    0 18px 30px -18px rgba(0, 0, 0, .35);
}
.phone-screen {
  position: relative; width: 100%; height: 100%;
  border-radius: 45px; overflow: hidden; isolation: isolate;
  background: var(--bg); color: var(--label);
  transform: translateZ(0);
}
.phone-island { position: absolute; z-index: 1000; top: 10px; left: 50%; width: 98px; height: 29px; margin-left: -49px; border-radius: 20px; background: #000; pointer-events: none; }
.phone-status {
  position: absolute; z-index: 999; inset: 0 0 auto 0; height: 50px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 3px 26px 0 36px; pointer-events: none;
  font: 600 15px/1 var(--font-text); letter-spacing: -0.01em; color: var(--label);
}
.phone-status__icons { display: flex; align-items: center; gap: 5px; }
.phone-status svg { fill: currentColor; }
.phone-home { position: absolute; z-index: 1000; bottom: 7px; left: 50%; width: 124px; height: 5px; margin-left: -62px; border-radius: 3px; background: var(--label); pointer-events: none; }
.phone[data-status="light"] .phone-status { color: #fff; }
.phone[data-status="light"] .phone-home { background: #fff; }
.phone[data-status="dark"] .phone-status { color: #000; }
.phone[data-status="dark"] .phone-home { background: #000; }
@media (max-width: 420px) { .phone { --phone-w: 316px; } }

/* =====================================================================
   CATALOG CHROME  (reserved prefixes: cat-, obj-, phone-, art-, av-, i)
   ===================================================================== */
.cat-app { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100vh; }

/* — Sidebar — */
.cat-side {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  background: var(--side); -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur);
  border-right: .5px solid var(--separator); z-index: 50;
}
.cat-side__head { padding: 22px 16px 10px; }
.cat-brand { display: flex; align-items: center; gap: 10px; margin: 0 4px 16px; }
.cat-brand__mark { width: 30px; height: 30px; border-radius: 8px; background: var(--grad-ocean); display: grid; place-items: center; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 6px rgba(10,132,255,.35); }
.cat-brand__mark svg { width: 17px; height: 17px; }
.cat-brand__name { font: 700 19px/1.1 var(--font-display); letter-spacing: -0.02em; }
.cat-brand__sub { font-size: 12px; color: var(--label-2); margin-top: 2px; letter-spacing: 0; }
.cat-search { position: relative; display: flex; align-items: center; height: 36px; border-radius: 10px; background: var(--fill-3); padding: 0 8px 0 30px; }
.cat-search svg { position: absolute; left: 9px; top: 50%; width: 15px; height: 15px; margin-top: -7.5px; color: var(--label-2); }
.cat-search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 15px; }
.cat-search input::placeholder { color: var(--label-2); }
.cat-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.cat-search kbd { font: 500 11px/1 var(--font-mono); color: var(--label-3); border: .5px solid var(--label-4); border-radius: 5px; padding: 3px 5px; }
.cat-nav { flex: 1; overflow: auto; padding: 4px 10px 24px; overscroll-behavior: contain; scrollbar-width: thin; }
.cat-nav__group { margin-top: 14px; }
.cat-nav__title { display: flex; align-items: baseline; gap: 6px; padding: 0 8px 4px; font-size: 12px; font-weight: 600; color: var(--label-2); letter-spacing: .02em; }
.cat-nav__title b { font-weight: 700; color: var(--label); letter-spacing: -0.01em; font-size: 13px; }
.cat-nav__title span:last-child { margin-left: auto; font: 500 11px/1 var(--font-mono); color: var(--label-3); }
.cat-nav a {
  display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 8px;
  color: var(--label); text-decoration: none; font-size: 13.5px; white-space: nowrap;
  transition: background var(--dur-1) ease, color var(--dur-1) ease;
}
.cat-nav a:hover { background: var(--fill-4); }
.cat-nav a .cat-nav__id { width: 50px; flex: none; font: 600 11px/1 var(--font-mono); color: var(--label-2); letter-spacing: 0; }
.cat-nav a .cat-nav__name { overflow: hidden; text-overflow: ellipsis; }
.cat-nav a .cat-nav__dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; flex: none; opacity: .9; }
.cat-nav a.is-active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.cat-nav a.is-active .cat-nav__id { color: var(--accent); }
.cat-nav a.is-todo { color: var(--label-3); }
.cat-side__foot { padding: 12px 18px 16px; border-top: .5px solid var(--separator); font-size: 12px; color: var(--label-2); display: flex; justify-content: space-between; }

/* — Main — */
.cat-main { min-width: 0; }
.cat-topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px;
  height: 56px; padding: 0 28px; margin-bottom: -56px; pointer-events: none;
}
.cat-topbar > * { pointer-events: auto; }
.cat-topbar__title { display: none; font: 600 17px/1 var(--font-text); }
.cat-menu-btn { display: none; }
.cat-topbar__spacer { flex: 1; }
.cat-seg { position: relative; display: inline-flex; padding: 2px; border-radius: 9px; background: var(--segment-bg); -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur); }
.cat-seg button { position: relative; z-index: 1; height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--label); }
.cat-seg button svg { width: 14px; height: 14px; }
.cat-seg button[aria-pressed="true"] { font-weight: 600; }
.cat-seg__thumb { position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 7px; background: var(--segment-thumb); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); transition: transform var(--dur-2) var(--ease-ios), width var(--dur-2) var(--ease-ios); }
.cat-solo-exit { display: none; height: 32px; padding: 0 14px 0 10px; border: 0; border-radius: 999px; background: var(--fill-3); font-size: 14px; font-weight: 600; color: var(--accent); cursor: pointer; align-items: center; gap: 4px; -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur); }
.cat-solo-exit svg { width: 15px; height: 15px; }

.cat-hero { padding: 72px 48px 12px; max-width: 1480px; }
.cat-eyebrow { margin: 0 0 10px; font: 600 12px/1 var(--font-text); letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
.cat-hero h1 { margin: 0; font: 800 64px/0.98 var(--font-display); letter-spacing: -0.045em; }
.cat-hero h1 span { background: var(--grad-ocean); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cat-lead { margin: 16px 0 0; max-width: 640px; font-size: 17px; line-height: 1.6; color: var(--label-2); letter-spacing: 0; }
.cat-stats { display: flex; gap: 28px; margin: 26px 0 0; padding: 0; list-style: none; }
.cat-stats li { display: flex; flex-direction: column; gap: 2px; }
.cat-stats b { font: 700 26px/1 var(--font-rounded); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.cat-stats span { font-size: 12px; color: var(--label-2); }

.cat-vectors { margin: 30px 0 0; }
.cat-vectors__label { font-size: 12px; font-weight: 600; color: var(--label-2); margin: 0 0 10px; letter-spacing: .02em; }
.cat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cat-chip {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 12px;
  border: 0; border-radius: 999px; background: var(--card); color: var(--label); cursor: pointer;
  font-size: 14px; font-weight: 500; box-shadow: inset 0 0 0 .5px var(--separator), var(--shadow-1);
  transition: transform var(--dur-1) var(--ease-out), background var(--dur-2) ease, color var(--dur-2) ease;
}
.cat-chip:active { transform: scale(.96); }
.cat-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--label-3)); }
.cat-chip em { font: 500 11px/1 var(--font-mono); font-style: normal; color: var(--label-3); }
.cat-chip[aria-pressed="true"] { background: var(--label); color: var(--page); box-shadow: none; }
.cat-chip[aria-pressed="true"] em { color: color-mix(in srgb, var(--page) 60%, transparent); }
.cat-vec-desc { min-height: 22px; margin: 12px 2px 0; font-size: 14px; color: var(--label-2); letter-spacing: 0; }
.cat-vec-desc b { color: var(--label); font-weight: 600; }

.cat-sections { padding: 8px 48px 80px; max-width: 1480px; }
.cat { padding-top: 40px; }
.cat[hidden] { display: none; }
.cat-head { display: flex; align-items: baseline; gap: 12px; margin: 0 4px 18px; scroll-margin-top: 24px; }
.cat-head h2 { margin: 0; font: 700 30px/1.1 var(--font-display); letter-spacing: -0.03em; }
.cat-head .cat-ja { font-size: 15px; color: var(--label-2); letter-spacing: 0; }
.cat-head .cat-count { margin-left: auto; font: 600 12px/1 var(--font-mono); color: var(--label-3); }
.cat-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); container-type: inline-size; align-items: start; grid-auto-flow: row dense; }
@container (min-width: 790px) { .obj[data-size="l"] { grid-column: span 2; } }
.obj[data-size="xl"] { grid-column: 1 / -1; }

/* — Object card — */
.obj {
  position: relative; display: flex; flex-direction: column; min-width: 0;
  background: var(--card); border-radius: 24px;
  box-shadow: 0 0 0 .5px var(--separator), 0 1px 2px rgba(0,0,0,.03), 0 10px 30px -12px rgba(0,0,0,.08);
  scroll-margin-top: 24px;
}
.obj[hidden] { display: none; }
.obj-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 0 14px; min-height: 52px; }
.obj-id {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; flex: none;
  border: 0; border-radius: 8px; background: var(--fill-3); color: var(--label); cursor: pointer;
  font: 700 12.5px/1 var(--font-mono); letter-spacing: .02em;
  transition: background var(--dur-1) ease, color var(--dur-1) ease, transform var(--dur-1) var(--ease-out);
}
.obj-id:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.obj-id:active { transform: scale(.95); }
.obj-id svg { width: 12px; height: 12px; opacity: .55; }
.obj-id.is-copied { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.obj-id.is-copied svg { opacity: 1; }
.obj-titles { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.obj-name { margin: 0; font: 600 16px/1.2 var(--font-text); letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.obj-ja { font-size: 12px; color: var(--label-2); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.obj-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.obj-vec { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .01em; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.obj-vec::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.obj-solo { width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--label-2); display: grid; place-items: center; cursor: pointer; transition: background var(--dur-1) ease, color var(--dur-1) ease; }
.obj-solo:hover { background: var(--fill-3); color: var(--label); }
.obj-solo svg { width: 15px; height: 15px; }
.obj-desc { margin: 8px 16px 12px; font-size: 13px; line-height: 1.5; color: var(--label-2); letter-spacing: 0; }
.obj-stage {
  position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  min-height: 280px; margin: 0 8px; padding: 32px 20px; border-radius: 18px;
  overflow: hidden; isolation: isolate; background: var(--bg-grouped);
}
.obj-stage[data-bg="plain"] { background: var(--bg); box-shadow: inset 0 0 0 .5px var(--separator); }
.obj-stage[data-bg="grouped"] { background: var(--bg-grouped); }
.obj-stage[data-bg="wallpaper"] { background: var(--wallpaper); }
.obj-stage[data-bg="dark"] { background: radial-gradient(120% 90% at 50% 0%, #1f1f24 0%, #0b0b0d 70%); }
.obj-notes { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 12px 14px 14px; list-style: none; }
.obj-notes li { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--fill-4); font-size: 12px; color: var(--label-2); letter-spacing: 0; }
.obj-notes li::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--label-3); }
.obj > .obj-stage:last-child { margin-bottom: 8px; }
.obj--todo .obj-stage { color: var(--label-3); font-size: 14px; }

/* — Vector colors — */
[data-vec="Clean"]     { --c: var(--blue); }
[data-vec="Glass"]     { --c: var(--cyan); }
[data-vec="Vivid"]     { --c: var(--pink); }
[data-vec="Immersive"] { --c: var(--indigo); }
[data-vec="Editorial"] { --c: var(--brown); }
[data-vec="Soft"]      { --c: var(--mint); }

/* — Empty search state — */
.cat-empty { display: none; margin: 60px 48px; padding: 48px 24px; text-align: center; color: var(--label-2); border-radius: 24px; background: var(--card); box-shadow: 0 0 0 .5px var(--separator); }
.cat-empty.is-shown { display: block; }
.cat-empty b { display: block; color: var(--label); font-size: 20px; margin-bottom: 6px; }

.cat-footer { padding: 24px 48px 48px; color: var(--label-3); font-size: 12px; }

/* — Copy toast — */
.cat-toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 200; display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 18px 0 14px; border-radius: 999px; transform: translate(-50%, 24px) scale(.96); opacity: 0;
  background: rgba(30, 30, 32, .82); color: #fff; font-size: 14px; font-weight: 500; letter-spacing: 0;
  -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur);
  box-shadow: 0 12px 30px rgba(0,0,0,.25), inset 0 0 0 .5px rgba(255,255,255,.12);
  transition: transform var(--dur-3) var(--ease-spring), opacity var(--dur-2) ease; pointer-events: none;
}
.cat-toast.is-shown { transform: translate(-50%, 0) scale(1); opacity: 1; }
.cat-toast svg { width: 18px; height: 18px; color: var(--green); }
.cat-toast b { font-family: var(--font-mono); font-weight: 700; }

/* — Solo (single object) mode — */
body.is-solo .cat-hero, body.is-solo .cat-footer, body.is-solo .cat-empty { display: none; }
body.is-solo .cat { display: none; }
body.is-solo .cat.has-solo { display: block; padding-top: 72px; }
body.is-solo .cat.has-solo .cat-head { display: none; }
body.is-solo .cat.has-solo .obj:not(.is-solo) { display: none; }
body.is-solo .cat.has-solo .cat-grid { grid-template-columns: minmax(0, 1fr); }
body.is-solo .obj.is-solo { grid-column: 1 / -1; max-width: 1180px; width: 100%; margin: 0 auto; }
body.is-solo .obj.is-solo .obj-stage { min-height: min(78vh, 900px); }
body.is-solo .cat-solo-exit { display: inline-flex; }

/* — Responsive — */
@media (max-width: 960px) {
  .cat-app { grid-template-columns: minmax(0, 1fr); }
  .cat-side {
    position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); transform: translateX(-104%);
    transition: transform var(--dur-3) var(--ease-ios); box-shadow: var(--shadow-3); background: var(--bg-elevated);
  }
  body.nav-open .cat-side { transform: none; }
  .cat-scrim { position: fixed; inset: 0; z-index: 45; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--dur-2) ease; }
  body.nav-open .cat-scrim { opacity: 1; pointer-events: auto; }
  .cat-topbar {
    margin-bottom: 0; padding: 0 12px; height: 52px; pointer-events: auto;
    background: var(--mat-chrome); -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur);
    border-bottom: .5px solid var(--separator);
  }
  .cat-topbar__title { display: block; }
  .cat-menu-btn { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--accent); cursor: pointer; }
  .cat-menu-btn svg { width: 22px; height: 22px; }
  .cat-seg button { padding: 0 9px; }
  .cat-seg button span { display: none; }
  .cat-hero { padding: 32px 16px 4px; }
  .cat-hero h1 { font-size: 44px; }
  .cat-sections { padding: 0 16px 60px; }
  .cat-footer { padding: 16px 16px 40px; }
  .cat-empty { margin: 40px 16px; }
  body.is-solo .cat.has-solo { padding-top: 16px; }
}
@media (min-width: 961px) { .cat-scrim { display: none; } }
@media (max-width: 520px) {
  .cat-grid { gap: 14px; }
  .obj { border-radius: 20px; }
  .obj-stage { padding: 24px 12px; margin: 0 6px; }
  .obj-vec { display: none; }
  .cat-stats { gap: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>

    <header class="cat-hero">

    </header>

    <div class="cat-sections" id="catSections">
<!-- @@SECTIONS@@ -->
    </div>
    <div class="cat-empty" id="catEmpty"><b>見つかりませんでした</b>別のキーワードで検索するか、絞り込みを解除してください。</div>
    <footer class="cat-footer">Objects — 共通トークン（色・角丸・影・モーション）でつながった UI オブジェクト集。</footer>
  </main>
</div>
<div class="cat-toast" id="catToast" role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.7 7.7-5.5 6a1 1 0 0 1-1.45.04l-2.5-2.5a1 1 0 1 1 1.42-1.42l1.76 1.77 4.8-5.24a1 1 0 0 1 1.47 1.35Z"/></svg><span></span></div>

<script>
/* =====================================================================
   CATALOG RUNTIME — builds headers, sidebar, filters, theme, copy, solo.
   ===================================================================== */
(() => {
  const VECTORS = {
    Clean: 'iOS標準。システムカラーと余白・階層で整える、最も汎用的なスタイル。',
    Glass: '背景を透かす半透明の素材感。ぼかしとハイライトで奥行きを出す。',
    Vivid: '鮮やかなグラデーションと、弾むようなモーションで楽しさを出す。',
    Immersive: '暗い背景と全面のメディアで、コンテンツに没入させる。',
    Editorial: '大きな文字組みが主役。雑誌のようなリズムと余白。',
    Soft: 'やわらかい色・大きめの丸み・穏やかな影で、親しみやすく。',
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const objs = $$('.obj');
  const sections = $$('.cat');

  /* — Phone chrome — */
  const statusIcons = '<svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>'
    + '<svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .6C5.2.6 2.7 1.7.8 3.5L2 4.7a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.9 6.9 0 0 0 8 4c-1.9 0-3.6.7-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.4c-.6 0-1.2.2-1.6.6L8 11.4l1.6-1.7c-.4-.4-1-.6-1.6-.6Z"/></svg>'
    + '<svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".38"/><rect x="2" y="2" width="20" height="9" rx="2.5"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2Z" opacity=".4"/></svg>';
  $$('.phone').forEach((p) => {
    const screen = $('.phone-screen', p);
    if (!screen) return;
    if (!$('.phone-island', p)) screen.insertAdjacentHTML('beforeend', '<div class="phone-island" aria-hidden="true"></div>');
    if (!$('.phone-status', p)) screen.insertAdjacentHTML('beforeend', `<div class="phone-status" aria-hidden="true"><span>9:41</span><span class="phone-status__icons">${statusIcons}</span></div>`);
    if (!$('.phone-home', p)) screen.insertAdjacentHTML('beforeend', '<div class="phone-home" aria-hidden="true"></div>');
  });

  /* — Card headers — */
  const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>';
  const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const soloIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>';
  const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  objs.forEach((o) => {
    const vecs = (o.dataset.vector || '').split(/\s+/).filter(Boolean);
    const head = document.createElement('header');
    head.className = 'obj-head';
    head.innerHTML =
      `<button class="obj-id" type="button" title="IDをコピー" aria-label="${o.id} をコピー">${o.id}${copyIcon}</button>` +
      `<div class="obj-titles"><h3 class="obj-name">${esc(o.dataset.name)}</h3><span class="obj-ja">${esc(o.dataset.ja)}</span></div>` +
      `<div class="obj-tools">${vecs.map((v) => `<span class="obj-vec" data-vec="${v}">${v}</span>`).join('')}` +
      `<button class="obj-solo" type="button" title="単体で表示" aria-label="${o.id} を単体で表示">${soloIcon}</button></div>`;
    o.prepend(head);
    if (o.dataset.desc) {
      const d = document.createElement('p');
      d.className = 'obj-desc';
      d.textContent = o.dataset.desc;
      head.after(d);
    }
  });

  /* — Toast — */
  const toast = $('#catToast');
  let toastT;
  const showToast = (html) => {
    $('span', toast).innerHTML = html;
    toast.classList.add('is-shown');
    clearTimeout(toastT);
    toastT = setTimeout(() => toast.classList.remove('is-shown'), 1600);
  };
  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove(); return ok;
    }
  };
  document.addEventListener('click', async (e) => {
    const idBtn = e.target.closest('.obj-id');
    if (idBtn) {
      const id = idBtn.closest('.obj').id;
      const ok = await copy(id);
      idBtn.classList.add('is-copied');
      idBtn.innerHTML = id + checkIcon;
      setTimeout(() => { idBtn.classList.remove('is-copied'); idBtn.innerHTML = id + copyIcon; }, 1400);
      showToast(ok ? `<b>${id}</b> をコピーしました` : `<b>${id}</b>`);
      return;
    }
    const soloBtn = e.target.closest('.obj-solo');
    if (soloBtn) setSolo(soloBtn.closest('.obj').id);
  });

  /* — Sidebar — */
  const nav = $('#catNav');
  sections.forEach((s) => {
    const g = document.createElement('div');
    g.className = 'cat-nav__group';
    g.dataset.cat = s.dataset.cat;
    const items = $$('.obj', s);
    g.innerHTML = `<div class="cat-nav__title"><b>${esc(s.dataset.title)}</b><span>${esc(s.dataset.ja)}</span><span>${items.length}</span></div>` +
      items.map((o) => {
        const v = (o.dataset.vector || '').split(/\s+/)[0];
        return `<a href="#${o.id}" data-id="${o.id}"${o.classList.contains('obj--todo') ? ' class="is-todo"' : ''}><span class="cat-nav__id">${o.id}</span><span class="cat-nav__name">${esc(o.dataset.name)}</span><i class="cat-nav__dot" data-vec="${v}" style="background:var(--c)"></i></a>`;
      }).join('');
    nav.appendChild(g);
  });
  $('#catCount').textContent = `${objs.length} objects`;

  /* — Stats — */
  const done = objs.filter((o) => !o.classList.contains('obj--todo')).length;
  $('#catStats').innerHTML =
    `<li><b>${done}</b><span>オブジェクト</span></li>` +
    `<li><b>${sections.length}</b><span>カテゴリ</span></li>` +
    `<li><b>${Object.keys(VECTORS).length}</b><span>デザインの方向性</span></li>`;

  /* — Vector chips — */
  const chips = $('#catChips');
  const vecDesc = $('#catVecDesc');
  const counts = {};
  objs.forEach((o) => (o.dataset.vector || '').split(/\s+/).filter(Boolean).forEach((v) => (counts[v] = (counts[v] || 0) + 1)));
  chips.innerHTML = `<button class="cat-chip" data-v="" aria-pressed="true"><i style="background:currentColor"></i>すべて<em>${objs.length}</em></button>` +
    Object.keys(VECTORS).map((v) => `<button class="cat-chip" data-v="${v}" data-vec="${v}" aria-pressed="false"><i></i>${v}<em>${counts[v] || 0}</em></button>`).join('');
  let vector = '';
  let query = '';
  const setVecDesc = (v) => { vecDesc.innerHTML = v ? `<b>${v}</b> — ${VECTORS[v]}` : '6つの方向性でデザインを作り分けています。チップを押すとその方向性だけを表示します。'; };
  setVecDesc('');
  chips.addEventListener('click', (e) => {
    const b = e.target.closest('.cat-chip');
    if (!b) return;
    vector = b.dataset.v;
    $$('.cat-chip', chips).forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
    setVecDesc(vector);
    applyFilter();
  });
  chips.addEventListener('mouseover', (e) => { const b = e.target.closest('.cat-chip'); if (b && b.dataset.v) setVecDesc(b.dataset.v); });
  chips.addEventListener('mouseleave', () => setVecDesc(vector));

  /* — Search + filter — */
  const search = $('#catSearch');
  const norm = (s) => String(s || '').toLowerCase().normalize('NFKC');
  function applyFilter() {
    let any = false;
    const q = norm(query).trim();
    objs.forEach((o) => {
      const hay = norm([o.id, o.dataset.name, o.dataset.ja, o.dataset.desc, o.dataset.vector].join(' '));
      const okQ = !q || q.split(/\s+/).every((t) => hay.includes(t));
      const okV = !vector || (o.dataset.vector || '').split(/\s+/).includes(vector);
      o.hidden = !(okQ && okV);
      const link = nav.querySelector(`a[data-id="${o.id}"]`);
      if (link) link.hidden = o.hidden;
      if (!o.hidden) any = true;
    });
    sections.forEach((s) => {
      const vis = $$('.obj', s).some((o) => !o.hidden);
      s.hidden = !vis;
      const g = nav.querySelector(`.cat-nav__group[data-cat="${s.dataset.cat}"]`);
      if (g) g.hidden = !vis;
    });
    $('#catEmpty').classList.toggle('is-shown', !any);
  }
  search.addEventListener('input', () => { query = search.value; applyFilter(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) {
      e.preventDefault(); search.focus();
    }
    if (e.key === 'Escape' && document.body.classList.contains('is-solo') && !document.activeElement.closest('.obj-stage')) setSolo(null);
  });

  /* — Active nav item — */
  const links = new Map($$('a', nav).map((a) => [a.dataset.id, a]));
  let activeId = null;
  const setActive = (id) => {
    if (id === activeId) return;
    if (activeId && links.get(activeId)) links.get(activeId).classList.remove('is-active');
    activeId = id;
    const a = links.get(id);
    if (a) {
      a.classList.add('is-active');
      const r = a.getBoundingClientRect(), nr = nav.getBoundingClientRect();
      if (r.top < nr.top || r.bottom > nr.bottom) nav.scrollTop += r.top - nr.top - nr.height / 2;
    }
  };
  const visible = new Set();
  const aio = new IntersectionObserver((entries) => {
    entries.forEach((e) => e.isIntersecting ? visible.add(e.target) : visible.delete(e.target));
    const first = objs.filter((o) => visible.has(o)).sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)[0];
    if (first) setActive(first.id);
  }, { rootMargin: '-20% 0px -55% 0px' });
  objs.forEach((o) => aio.observe(o));

  /* — Mobile drawer — */
  const closeNav = () => document.body.classList.remove('nav-open');
  $('#catMenu').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#catScrim').addEventListener('click', closeNav);
  nav.addEventListener('click', (e) => {
    const a = e.target.closest('a');
    if (!a) return;
    closeNav();
    if (document.body.classList.contains('is-solo')) { e.preventDefault(); setSolo(a.dataset.id); }
  });

  /* — Solo mode (?solo=ID) — */
  function setSolo(id) {
    $$('.obj.is-solo').forEach((o) => o.classList.remove('is-solo'));
    $$('.cat.has-solo').forEach((s) => s.classList.remove('has-solo'));
    const url = new URL(location.href);
    if (id && document.getElementById(id)) {
      const o = document.getElementById(id);
      o.classList.add('is-solo');
      o.closest('.cat').classList.add('has-solo');
      document.body.classList.add('is-solo');
      url.searchParams.set('solo', id); url.hash = '';
      history.replaceState(null, '', url);
      window.scrollTo({ top: 0, behavior: 'instant' });
      setActive(id);
    } else {
      document.body.classList.remove('is-solo');
      const prev = url.searchParams.get('solo');
      url.searchParams.delete('solo');
      history.replaceState(null, '', url);
      if (prev && document.getElementById(prev)) document.getElementById(prev).scrollIntoView({ block: 'start', behavior: 'instant' });
    }
  }
  $('#catSoloExit').addEventListener('click', () => setSolo(null));
  const soloParam = new URLSearchParams(location.search).get('solo');
  if (soloParam) setSolo(soloParam);

  /* — Theme switch — */
  const seg = $('#catTheme');
  const thumb = $('.cat-seg__thumb', seg);
  const placeThumb = () => {
    const b = $('button[aria-pressed="true"]', seg);
    thumb.style.width = b.offsetWidth + 'px';
    thumb.style.transform = `translateX(${b.offsetLeft}px)`;
  };
  const setTheme = (v, save) => {
    if (v === 'light' || v === 'dark') document.documentElement.dataset.theme = v;
    else delete document.documentElement.dataset.theme;
    $$('button', seg).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    placeThumb();
    if (save) { try { localStorage.setItem('objcat-theme', v); } catch (e) {} }
    document.dispatchEvent(new CustomEvent('objcat:theme', { detail: v }));
  };
  seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.v, true); });
  let saved = 'auto';
  try { saved = localStorage.getItem('objcat-theme') || 'auto'; } catch (e) {}
  setTheme(saved, false);
  addEventListener('resize', placeThumb);
  document.fonts && document.fonts.ready.then(placeThumb);
})();
</script>
</body>
</html>

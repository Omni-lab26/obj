<title>Inchly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: a phone-sized app on a neutral desk. Two surface levels (canvas grey, white), hairlines instead of shadows,
   green reserved for "studied" (records, progress, the start action). Each screen has its own structure. */
:root{
  --canvas:#F3F3F1; --surface:#FFFFFF; --sunken:#ECECE9; --line:rgba(23,24,26,.09); --line-2:rgba(23,24,26,.16);
  --ink:#17181A; --ink-2:#55585E; --ink-3:#8C8F95; --on-ink:#FFFFFF;
  --green:#15985A; --green-ink:#0E7A46; --green-soft:#E2F3E9;
  --g0:#E7E8E5; --g1:#B4E2C4; --g2:#68C78E; --g3:#2EA463; --g4:#157A46;
  --amber:#C7741A; --amber-soft:#FBEEDD; --red:#D9434A; --red-soft:#FBE6E6; --blue:#3567D6;
  --desk:#E6E6E3; --frame:#17181A;
  --ui:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --num:"Inter","Noto Sans JP",system-ui,sans-serif;
  --e-press:cubic-bezier(.3,.9,.4,1); --e-spring:cubic-bezier(.28,1.3,.36,1); --e-out:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#111213; --surface:#1A1B1D; --sunken:#232427; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --ink:#ECEDEE; --ink-2:#A9ACB1; --ink-3:#73767C; --on-ink:#111213;
  --green:#2DBE73; --green-ink:#4ED48C; --green-soft:#16301F;
  --g0:#25272A; --g1:#1B4D31; --g2:#1F7A47; --g3:#2EA463; --g4:#56D68F;
  --amber:#E89A45; --amber-soft:#33261A; --red:#F0676C; --red-soft:#3A1F21; --blue:#6E95F0;
  --desk:#08090A; --frame:#000000; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --canvas:#111213; --surface:#1A1B1D; --sunken:#232427; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --ink:#ECEDEE; --ink-2:#A9ACB1; --ink-3:#73767C; --on-ink:#111213;
  --green:#2DBE73; --green-ink:#4ED48C; --green-soft:#16301F;
  --g0:#25272A; --g1:#1B4D31; --g2:#1F7A47; --g3:#2EA463; --g4:#56D68F;
  --amber:#E89A45; --amber-soft:#33261A; --red:#F0676C; --red-soft:#3A1F21; --blue:#6E95F0;
  --desk:#08090A; --frame:#000000; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"palt" 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- desk + phone ---------- */
.desk{height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding-block:20px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.notes{width:270px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:14px}
.notes h1{font:700 24px/1.2 var(--num);color:var(--ink);letter-spacing:-.02em}
.notes ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.notes .theme{display:flex;gap:6px}
.notes .theme button{padding:6px 12px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px}
.phone{position:relative;width:390px;height:min(844px,100%);border-radius:54px;padding:10px;background:var(--frame);flex:none;box-shadow:0 30px 70px rgba(0,0,0,.18)}
.screen{position:absolute;inset:10px;border-radius:44px;overflow:hidden;background:var(--canvas);isolation:isolate}
.sbar{position:absolute;top:0;left:0;right:0;height:48px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font:600 15px var(--num);pointer-events:none}
.screen.on-dark .sbar{color:#F2F3F1}
.sbar .cut{position:absolute;left:50%;top:11px;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#000}
.sbar .ic{display:flex;gap:5px;align-items:center}.sbar .ic i{display:block;background:currentColor;border-radius:2px}

/* ---------- stack navigation ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas)}
.view.enter{animation:push .32s var(--e-out)}
.view.back{animation:pop .26s var(--e-out)}
@keyframes push{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateX(-18px);opacity:.4}to{transform:none;opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:110px}
.scroll::-webkit-scrollbar{display:none}
.top{padding:58px 20px 8px;display:flex;align-items:center;gap:8px;flex:none}
.top .grow{flex:1;min-width:0}
.top .date{font-size:13px;color:var(--ink-3)}
.top h1{font:700 26px/1.3 var(--ui);letter-spacing:.01em}
.navbar{padding:54px 12px 6px;display:flex;align-items:center;gap:6px;flex:none;border-bottom:1px solid transparent}
.navbar h1{flex:1;font:700 17px var(--ui);text-align:center;margin-right:40px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);position:relative;transition:background .16s,transform .2s var(--e-press)}
.iconbtn:active{transform:scale(.92);background:var(--sunken)}
.iconbtn svg{width:22px;height:22px}
.iconbtn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--canvas)}

/* ---------- type & building blocks ---------- */
.sec{padding:22px 20px 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sh h2{font:700 15px var(--ui)}
.sh .aux{font-size:12.5px;color:var(--ink-3)}
.link{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:2px;transition:color .16s}
.link:active{color:var(--ink)}
.muted{color:var(--ink-3)}
.sub{font-size:12.5px;color:var(--ink-3)}
.hair{height:1px;background:var(--line);margin:0 20px}
.surface{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line)}

/* buttons: one shape per role */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font:700 15px var(--ui);transition:transform .2s var(--e-press),background .16s,color .16s,opacity .16s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.go{background:var(--green);color:#fff}
.btn.quiet{background:var(--sunken);color:var(--ink)}
.btn.line{box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink)}
.btn.small{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn svg{width:18px;height:18px}
.btn .spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.done{background:var(--green);color:#fff}
.follow{height:32px;padding:0 14px;border-radius:9px;font:700 13px var(--ui);background:var(--ink);color:var(--on-ink);transition:transform .2s var(--e-press),background .18s,color .18s;flex:none}
.follow:active{transform:scale(.95)}
.follow.on{background:var(--sunken);color:var(--ink-2)}

/* rolling digits (odometer) */
.roll{display:inline-flex;overflow:hidden;line-height:1;vertical-align:baseline}
.roll .col{display:inline-block;height:1em;overflow:hidden;position:relative}
.roll .col span{display:flex;flex-direction:column;transition:transform .55s var(--e-out)}
.roll .col span b{height:1em;font-weight:inherit;display:block;text-align:center}
.roll .sep{display:inline-block}

/* segmented tabs with sliding indicator */
.tabs{position:relative;display:flex;padding:3px;border-radius:12px;background:var(--sunken)}
.tabs button{position:relative;z-index:1;flex:1;height:34px;border-radius:9px;font:500 13.5px var(--ui);color:var(--ink-2);transition:color .16s,transform .16s var(--e-out)}
.tabs button:active{transform:scale(.96)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabs .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:9px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line);transition:transform .32s var(--e-out),width .32s var(--e-out)}
.under{position:relative;display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--line)}
.under button{height:44px;font:500 14.5px var(--ui);color:var(--ink-3);transition:color .16s}
.under button[aria-selected="true"]{color:var(--ink);font-weight:700}
.under .ind{position:absolute;bottom:-1px;left:0;height:2px;border-radius:2px;background:var(--ink);transition:transform .32s var(--e-out),width .32s var(--e-out)}

/* bottom tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:8px 6px 26px;background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);transition:color .16s,transform .2s var(--e-press)}
.tab:active{transform:scale(.92)}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--ink)}
.tab[aria-current="true"] svg{stroke-width:2.2}
.tab.start .sq{width:52px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;transition:transform .24s var(--e-spring)}
.tab.start:active .sq{transform:scale(.9)}
.tab.start svg{width:20px;height:20px}
.tab.start.live .sq{background:var(--ink);color:var(--on-ink)}

/* live island (expands for controls) */
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);z-index:45;height:34px;width:118px;border-radius:20px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;overflow:hidden;transition:width .42s var(--e-spring),height .42s var(--e-spring),border-radius .42s var(--e-spring)}
.island .mini{display:flex;align-items:center;justify-content:space-between;width:100%;font:600 12.5px var(--num);gap:8px;opacity:0;transition:opacity .2s}
.island.on{width:206px}
.island.on .mini{opacity:1}
.island .ldot{width:7px;height:7px;border-radius:50%;background:#3BD47F;box-shadow:0 0 0 3px rgba(59,212,127,.25)}
.island .full{position:absolute;inset:0;padding:14px 16px;display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .18s}
.island.open{width:350px;height:132px;border-radius:30px}
.island.open .mini{opacity:0}
.island.open .full{opacity:1;pointer-events:auto;transition-delay:.12s}
.island .full .r{display:flex;align-items:center;gap:10px}
.island .full .t{font:600 30px/1 var(--num);letter-spacing:-.02em}
.island .full .s{font-size:12px;color:rgba(255,255,255,.6)}
.island .full .seg{display:flex;gap:3px;flex:1}
.island .full .seg i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.island .full .seg i b{position:absolute;inset:0 auto 0 0;background:#3BD47F}
.island .full .ib{height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.14);font:700 13px var(--ui);transition:transform .2s var(--e-press)}
.island .full .ib:active{transform:scale(.94)}

/* toast stack */
.toasts{position:absolute;top:54px;left:12px;right:12px;z-index:44;height:0}
.toast{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.12),inset 0 0 0 1px var(--line);transition:transform .36s var(--e-spring),opacity .26s;font-size:13.5px}
.toast .ti{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--green-soft);color:var(--green-ink)}
.toast .ti svg{width:15px;height:15px}
.toast .tt{flex:1;min-width:0;line-height:1.35}
.toast .tt b{display:block;font-size:13.5px}
.toast .tt span{font-size:12px;color:var(--ink-3)}
.toast .ta{height:30px;padding:0 10px;border-radius:8px;background:var(--sunken);font:700 12.5px var(--ui)}
.toasts.spread .toast{transition:transform .36s var(--e-spring)}

/* sheet */
.scrim{position:absolute;inset:0;z-index:48;background:rgba(10,10,12,.32);opacity:0;transition:opacity .24s}
.scrim.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:49;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px 30px;transform:translateY(100%);transition:transform .38s var(--e-out);scrollbar-width:none}
.sheet.show{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 12px}
.sheet h3{font:700 19px var(--ui);margin-bottom:4px}

/* checklist */
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.todo:first-child{border-top:0}
.cbox{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.6px var(--line-2);display:grid;place-items:center;flex:none;transition:background .2s,box-shadow .2s,transform .2s var(--e-spring)}
.cbox svg{width:14px;height:14px}
.cbox path{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .26s var(--e-out) .06s}
.todo.done .cbox{background:var(--green);box-shadow:none}
.todo.done .cbox path{stroke-dashoffset:0}
.todo:active .cbox{transform:scale(.88)}
.todo .tt{flex:0 1 auto;margin-right:auto;min-width:0;position:relative;transition:color .2s}
.todo .tt::after{content:"";position:absolute;left:0;right:0;top:52%;height:1.5px;background:var(--ink-3);transform:scaleX(0);transform-origin:left;transition:transform .32s var(--e-out) .08s}
.todo.done .tt{color:var(--ink-3)}
.todo.done .tt::after{transform:scaleX(1)}
.todo .sj{font-size:12px;color:var(--ink-3);flex:none}

/* subject dots */
.sd{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}

/* heat (grass) */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;touch-action:none;position:relative}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--g0);transition:transform .16s var(--e-out)}
.heat i.l1{background:var(--g1)}.heat i.l2{background:var(--g2)}.heat i.l3{background:var(--g3)}.heat i.l4{background:var(--g4)}
.heat i.hot{transform:scale(1.35);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.heat i.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.htip{position:absolute;z-index:5;pointer-events:none;padding:6px 9px;border-radius:9px;background:var(--ink);color:var(--on-ink);font-size:12px;white-space:nowrap;transform:translate(-50%,-130%);transition:left .12s var(--e-out),top .12s var(--e-out)}
.legend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-3)}
.legend i{width:10px;height:10px;border-radius:2.5px;display:inline-block}

/* ---------- HOME ---------- */
.hero{padding:6px 20px 0}
.hero .lab{font-size:13px;color:var(--ink-2)}
.hero .big{font:600 68px/1 var(--num);letter-spacing:-.04em;display:flex;align-items:baseline;gap:2px;margin-top:6px}
.hero .big .u{font:500 18px var(--ui);color:var(--ink-3);letter-spacing:0;margin:0 8px 0 4px}
.goal{margin-top:14px}
.goal .bar{position:relative;height:8px;border-radius:4px;background:var(--g0);overflow:hidden}
.goal .bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--green);transition:width .8s var(--e-out)}
.goal .bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.goal .gl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-top:7px}
.startrow{display:flex;gap:8px;margin-top:18px}
.startrow .btn.go{flex:1;height:54px;font-size:16px;border-radius:14px;justify-content:space-between;padding:0 18px}
.startrow .btn.go .n{font-weight:600;opacity:.85}
.subjpick{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.subjpick::-webkit-scrollbar{display:none}
.subjpick button{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;flex:none;transition:transform .2s var(--e-press),box-shadow .16s}
.subjpick button:active{transform:scale(.95)}
.subjpick button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.6px var(--ink);font-weight:700}
.dl{display:flex;flex-direction:column}
.dl .r{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.dl .r:first-child{border-top:0}
.dl .r .t{flex:1;min-width:0}
.dl .r .t b{display:block;font-size:14.5px;font-weight:500}
.dl .r .days{font:600 22px var(--num);text-align:right;min-width:60px}
.dl .r .days small{font:500 12px var(--ui);color:var(--ink-3);margin-left:2px}
.dl .r.urgent .days{color:var(--amber)}
.mini-seg{display:flex;gap:2px;margin-top:5px;width:140px}
.mini-seg i{flex:1;height:3px;border-radius:2px;background:var(--g0)}
.mini-seg i.on{background:var(--ink-2)}
.peers{display:flex;align-items:center;gap:12px}
.stack{display:flex}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px var(--ui);flex:none;background:var(--c);box-shadow:0 0 0 2px var(--canvas)}
.stack .av{margin-left:-8px;transition:transform .3s var(--e-spring)}
.stack .av:first-child{margin-left:0}
.stack .av.new{animation:popin .42s var(--e-spring)}
@keyframes popin{from{transform:scale(.3) translateX(-10px);opacity:0}to{transform:none;opacity:1}}
.week{display:flex;gap:6px;margin-top:12px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.week i{width:100%;aspect-ratio:1;border-radius:8px;background:var(--g0);display:grid;place-items:center}
.week i.l1{background:var(--g1)}.week i.l2{background:var(--g2)}.week i.l3{background:var(--g3)}.week i.l4{background:var(--g4)}
.week i.ticket{background:repeating-linear-gradient(135deg,var(--g0) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px var(--line-2)}
.week .today{color:var(--ink);font-weight:700}

/* ---------- RECORDS ---------- */
.total{display:flex;align-items:baseline;gap:10px;padding:2px 20px 0}
.total .v{font:600 44px/1 var(--num);letter-spacing:-.03em}
.total .v small{font:500 15px var(--ui);color:var(--ink-3);margin-left:4px}
.delta{font-size:13px;color:var(--green-ink);font-weight:700}
.chart{position:relative;height:170px;margin:16px 20px 0;touch-action:none;cursor:crosshair}
.chart .cols{position:absolute;inset:0 0 22px 0;display:flex;align-items:flex-end;gap:5px}
.chart .c{flex:1;height:100%;display:flex;flex-direction:column-reverse;gap:2px;position:relative;border-radius:6px;transition:opacity .16s}
.chart .c b{display:block;border-radius:3px;background:var(--c);transform-origin:bottom;animation:grow .5s var(--e-out) both;animation-delay:calc(var(--i) * 22ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.chart.scrub .c{opacity:.35}
.chart.scrub .c.hot{opacity:1}
.chart .c.hot::after{content:"";position:absolute;inset:-4px -3px;border-radius:8px;box-shadow:0 0 0 1.5px var(--ink)}
.chart .x{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font:500 11px var(--num);color:var(--ink-3)}
.ctip{position:absolute;top:0;z-index:3;width:150px;padding:10px 12px;border-radius:12px;background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.12),inset 0 0 0 1px var(--line);font-size:12.5px;pointer-events:none;transition:left .18s var(--e-out),opacity .16s}
.ctip .d{font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
.ctip .row{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.ctip .row .n{margin-left:auto;color:var(--ink)}
.subjtable .r{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.subjtable .r:first-child{border-top:0}
.subjtable .nm{display:flex;align-items:center;gap:8px;font-weight:500}
.subjtable .v{font:600 15px var(--num)}
.subjtable .pb{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--g0);position:relative;overflow:hidden}
.subjtable .pb i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:2px}
.subjtable .gtag{font-size:12px;color:var(--ink-3)}
.subjtable .gtag.low{color:var(--amber)}
.linechart svg{width:100%;height:auto;display:block;overflow:visible}

/* ---------- TIMER (focus) ---------- */
.focusmode{background:#0F1110;color:#F2F3F1}
.focusmode .navbar{color:#F2F3F1}
.focusmode .iconbtn{color:rgba(255,255,255,.7)}
.focusmode .iconbtn:active{background:rgba(255,255,255,.08)}
.fsubj{display:flex;gap:6px;justify-content:center;padding:4px 20px 0}
.fsubj button{height:32px;padding:0 12px;border-radius:9px;font-size:13px;color:rgba(255,255,255,.6);transition:background .16s,color .16s,transform .2s var(--e-press)}
.fsubj button:active{transform:scale(.95)}
.fsubj button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.dial{position:relative;width:286px;height:286px;margin:22px auto 0}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10}
.dial .arc{fill:none;stroke:#2EC471;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.dial .tk{stroke:rgba(255,255,255,.22);stroke-width:1.5}
.dial .tk.m{stroke:rgba(255,255,255,.45);stroke-width:2}
.dial .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.dial .clock{font:500 46px/1 var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dial .ph{font-size:13px;color:rgba(255,255,255,.55)}
.dial.paused .clock{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.fmeta{display:flex;justify-content:center;gap:22px;margin-top:6px;font-size:12.5px;color:rgba(255,255,255,.55)}
.fmeta b{color:#fff;font:600 13px var(--num)}
.fctl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:22px}
.fctl .side{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.08);font:600 14px var(--num);color:#fff;transition:transform .24s var(--e-spring),background .16s}
.fctl .side:active{transform:scale(.9);background:rgba(255,255,255,.14)}
.fctl .main{width:82px;height:82px;border-radius:50%;background:#F2F3F1;color:#0F1110;display:grid;place-items:center;transition:transform .24s var(--e-spring)}
.fctl .main:active{transform:scale(.92)}
.fctl .main svg{width:30px;height:30px}
.slide{position:relative;height:60px;margin:30px 24px 0;border-radius:18px;background:rgba(255,255,255,.08);overflow:hidden;touch-action:none;user-select:none}
.slide .fill{position:absolute;inset:0 auto 0 0;background:rgba(46,196,113,.22);width:60px}
.slide .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:rgba(255,255,255,.55);transition:opacity .2s}
.slide .knob{position:absolute;top:6px;left:6px;width:48px;height:48px;border-radius:13px;background:#2EC471;color:#0F1110;display:grid;place-items:center;cursor:grab}
.slide .knob svg{width:22px;height:22px}
.slide.snap .knob,.slide.snap .fill{transition:transform .34s var(--e-spring),width .34s var(--e-spring)}
.receipt{overflow:hidden}
.receipt .paper{transform-origin:top;animation:print .6s var(--e-out)}
@keyframes print{from{transform:translateY(-30px);clip-path:inset(0 0 100% 0)}to{transform:none;clip-path:inset(0 0 0 0)}}
.rline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:14px}
.rline .n{font-weight:600}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{height:36px;padding:0 13px;border-radius:10px;background:var(--sunken);font-size:13.5px;transition:background .16s,color .16s,transform .2s var(--e-press)}
.choice button:active{transform:scale(.95)}
.choice button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:700}

/* ---------- COMMUNITY ---------- */
.livebig{padding:16px 20px 4px;display:flex;align-items:baseline;gap:8px}
.livebig .v{font:600 40px/1 var(--num);letter-spacing:-.03em}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft);flex:none;animation:breath 2.4s ease-in-out infinite}
@keyframes breath{50%{box-shadow:0 0 0 6px transparent}}
.people .p{display:flex;align-items:center;gap:12px;padding:10px 20px}
.people .p .t{flex:1;min-width:0;line-height:1.35}
.people .p .t b{font-size:14.5px;font-weight:500}
.people .p .t>span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people .p .tm{font:500 13.5px var(--num);color:var(--ink-2)}
.people .p .rk{width:24px;font:600 14px var(--num);color:var(--ink-3);text-align:center}
.people .p.me{background:var(--green-soft)}
.people .p.me .rk{color:var(--green-ink)}
.myrank{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end;padding:16px 20px}
.myrank .v{font:600 44px/1 var(--num);letter-spacing:-.03em}
.dist{display:flex;align-items:flex-end;gap:2px;height:46px}
.dist i{flex:1;background:var(--g0);border-radius:2px}
.dist i.me{background:var(--green)}
.post{padding:16px 20px;border-top:1px solid var(--line)}
.post .h{display:flex;align-items:center;gap:10px}
.post .h b{font-size:14px}
.post .h span{font-size:12px;color:var(--ink-3)}
.post p{margin-top:8px;font-size:14.5px;line-height:1.75}
.post .tags{margin-top:6px;font-size:12.5px;color:var(--blue)}
.post .acts{display:flex;align-items:center;gap:18px;margin-top:10px}
.helpful{position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 8px;border-radius:9px;font:500 13px var(--ui);color:var(--ink-2);transition:background .16s,color .16s,transform .2s var(--e-press)}
.helpful:active{transform:scale(.94)}
.helpful svg{width:18px;height:18px;transition:transform .3s var(--e-spring)}
.helpful.on{background:var(--green-soft);color:var(--green-ink)}
.helpful.on svg{animation:pop .42s var(--e-spring)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
.burst{position:absolute;left:17px;top:16px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--green);animation:fly .5s var(--e-out) forwards}
@keyframes fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.compose{display:flex;align-items:center;gap:10px;margin:14px 20px 4px;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3);font-size:14px;width:calc(100% - 40px);text-align:left}
.grouprow{display:flex;align-items:center;gap:12px;padding:12px 20px;width:100%;text-align:left;transition:background .16s}
.grouprow:active{background:var(--sunken)}
.gmark{width:44px;height:44px;border-radius:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:7px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.gmark i{border-radius:50%;background:var(--c)}
.grouprow .t{flex:1;min-width:0;line-height:1.4}
.grouprow .t b{font-size:15px;font-weight:500}
.grouprow .t span{display:block;font-size:12.5px;color:var(--ink-3)}
.livecount{font-size:12px;color:var(--green-ink);display:flex;align-items:center;gap:6px;flex:none}

/* group detail */
.presence{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.presence .t{flex:1;min-width:0;font-size:13px;line-height:1.35}
.presence .t span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;gap:10px;padding:14px 16px 150px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:84%}
.m .who{font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.m .bb{padding:9px 12px;border-radius:16px 16px 16px 4px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;line-height:1.55}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m.me .bb{background:var(--ink);color:var(--on-ink);box-shadow:none;border-radius:16px 16px 4px 16px}
.m .av{width:28px;height:28px;font-size:11px;box-shadow:none}
.sysm{align-self:center;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);padding:4px 4px 4px 10px;border-radius:10px;background:var(--sunken)}
.sysm .go{height:26px;padding:0 10px;border-radius:7px;background:var(--surface);color:var(--green-ink);font:700 12px var(--ui);box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s var(--e-press)}
.sysm .go:active{transform:scale(.94)}
.card2{padding:12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;min-width:220px}
.card2 .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card2 .h b{font-size:14px}
.card2 .h span{font-size:12px;color:var(--ink-3)}
.card2 .qo{display:flex;flex-direction:column;gap:6px}
.card2 .qo button{height:38px;border-radius:10px;background:var(--sunken);text-align:left;padding:0 12px;font-size:14px;transition:background .16s,color .16s,transform .2s var(--e-press)}
.card2 .qo button:active{transform:scale(.98)}
.card2 .qo button.right{background:var(--green-soft);color:var(--green-ink);font-weight:700}
.card2 .qo button.wrong{background:var(--red-soft);color:var(--red)}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--canvas);border-top:1px solid var(--line);padding:8px 0 26px}
.qa{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.qa::-webkit-scrollbar{display:none}
.qa button{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;transition:transform .2s var(--e-press)}
.qa button:active{transform:scale(.95)}
.qa button.go{background:var(--green);color:#fff;box-shadow:none;font-weight:700}
.qa svg{width:16px;height:16px}
.composer{display:flex;gap:8px;padding:0 12px}
.composer input{flex:1;min-width:0;height:42px;border:0;border-radius:12px;padding:0 14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);outline:none;font-size:15px}
.composer input:focus{box-shadow:inset 0 0 0 1.6px var(--ink)}
.send{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;transition:transform .2s var(--e-press),opacity .16s}
.send:active{transform:scale(.92)}
.send[disabled]{opacity:.3}
.send svg{width:18px;height:18px}
.ev{display:flex;gap:14px;padding:14px 20px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .dt{width:44px;text-align:center;flex:none;line-height:1.1}
.ev .dt b{display:block;font:600 22px var(--num)}
.ev .dt span{font-size:11.5px;color:var(--ink-3)}
.ev .t{flex:1;min-width:0}
.ev .t b{font-size:15px;font-weight:500}
.ev .t .sub{margin-top:2px}
.ev .foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ev.fresh{animation:flash 1.6s var(--e-out)}
@keyframes flash{0%{background:var(--green-soft)}100%{background:transparent}}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border-radius:15px;background:var(--sunken);font:500 12.5px var(--num)}
.pill .stack .av{width:22px;height:22px;font-size:9.5px;box-shadow:0 0 0 2px var(--sunken)}
.shared .r{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.shared .r:first-child{border-top:0}
.thumb{width:44px;height:44px;border-radius:10px;flex:none;background:repeating-linear-gradient(180deg,var(--surface) 0 6px,var(--line) 6px 7px);box-shadow:inset 0 0 0 1px var(--line)}
.thumb.v{background:var(--ink);display:grid;place-items:center}
.thumb.v::after{content:"";border-left:10px solid var(--surface);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}

/* ---------- forms ---------- */
.form{padding:8px 20px 140px;display:flex;flex-direction:column;gap:26px}
.field{position:relative}
.field input,.field textarea{width:100%;border:0;outline:none;background:transparent;border-radius:12px;padding:16px 14px 12px;font-size:16px;box-shadow:inset 0 0 0 1px var(--line-2);transition:box-shadow .16s;resize:none}
.field textarea{min-height:88px;line-height:1.6}
.field label{position:absolute;left:12px;top:15px;padding:0 4px;color:var(--ink-3);font-size:16px;pointer-events:none;background:var(--canvas);transition:transform .2s var(--e-out),font-size .2s var(--e-out),color .16s;transform-origin:left}
.field.up label{transform:translateY(-24px);font-size:12.5px;color:var(--ink-2)}
.field.focus input,.field.focus textarea{box-shadow:inset 0 0 0 1.6px var(--ink)}
.field.focus label{color:var(--ink)}
.field.err input,.field.err textarea{box-shadow:inset 0 0 0 1.6px var(--red)}
.field.err label{color:var(--red)}
.field .help{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px;padding:0 2px}
.field.err .help .msg{color:var(--red)}
.fl{font:700 15px var(--ui);margin-bottom:4px}
.fd{font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{height:74px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;transition:transform .26s var(--e-spring),box-shadow .16s}
.opts button svg{width:22px;height:22px;color:var(--ink-2)}
.opts button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);font-weight:700;transform:scale(1.03)}
.opts.dim button:not([aria-pressed="true"]){transform:scale(.97)}
.radio{display:flex;flex-direction:column;gap:8px}
.radio button{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:box-shadow .16s,transform .2s var(--e-press)}
.radio button:active{transform:scale(.985)}
.radio .rd{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--line-2);flex:none;margin-top:2px;display:grid;place-items:center;transition:box-shadow .2s}
.radio .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .26s var(--e-spring)}
.radio button[aria-checked="true"]{box-shadow:inset 0 0 0 1.6px var(--ink)}
.radio button[aria-checked="true"] .rd{box-shadow:inset 0 0 0 1.6px var(--ink)}
.radio button[aria-checked="true"] .rd::after{transform:scale(1)}
.radio b{display:block;font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:2px}
.radio span{font-size:12.5px;color:var(--ink-3)}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.stepper .sv{font:600 28px var(--num);display:flex;align-items:baseline;gap:4px}
.stepper .sv small{font:500 13px var(--ui);color:var(--ink-3)}
.stepper button{width:46px;height:46px;border-radius:11px;background:var(--sunken);font:500 22px var(--num);transition:transform .2s var(--e-press),background .16s}
.stepper button:active{transform:scale(.9)}
.stepper button[disabled]{opacity:.35}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:52px;height:64px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--ink-3);transition:transform .2s var(--e-press),background .16s,color .16s}
.days button b{font:600 19px var(--num);color:var(--ink)}
.days button:active{transform:scale(.94)}
.days button[aria-pressed="true"]{background:var(--ink);color:rgba(255,255,255,.7);box-shadow:none}
.days button[aria-pressed="true"] b{color:var(--on-ink)}
.ruler{margin-top:12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:14px 0 10px;overflow:hidden;position:relative;touch-action:none;user-select:none;cursor:grab}
.ruler .rv{text-align:center;font:600 30px var(--num);letter-spacing:-.02em}
.ruler .rv small{font:500 13px var(--ui);color:var(--ink-3);margin-left:6px}
.ruler .track{position:relative;height:46px;margin-top:6px}
.ruler .ticks{position:absolute;top:0;left:50%;height:100%;display:flex;align-items:flex-start;will-change:transform}
.ruler .ticks i{width:12px;flex:none;position:relative;height:100%}
.ruler .ticks i::before{content:"";position:absolute;left:0;top:0;width:1.5px;height:10px;background:var(--line-2)}
.ruler .ticks i.h::before{height:20px;background:var(--ink-3)}
.ruler .ticks i.h span{position:absolute;left:-14px;top:24px;width:30px;text-align:center;font:500 11px var(--num);color:var(--ink-3)}
.ruler .needle{position:absolute;left:50%;top:-4px;width:2px;height:28px;margin-left:-1px;background:var(--red);border-radius:1px}
.ruler::before,.ruler::after{content:"";position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
.ruler::before{left:0;background:linear-gradient(90deg,var(--surface),transparent)}
.ruler::after{right:0;background:linear-gradient(-90deg,var(--surface),transparent)}
.footbar{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:12px 20px 30px;background:var(--canvas);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.footbar .sum{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.footbar .sum b{color:var(--ink);font-weight:700}

/* ---------- NOTIFICATIONS ---------- */
.nday{padding:18px 20px 6px;font:700 13px var(--ui);color:var(--ink-3)}
.nrow{position:relative;overflow:hidden;touch-action:pan-y}
.nrow .acts{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font:700 13px var(--ui);color:#fff}
.nrow .acts .l{background:var(--green)}
.nrow .content{position:relative;display:flex;gap:12px;padding:14px 20px;background:var(--canvas);transition:transform .3s var(--e-out),background .2s}
.nrow.drag .content{transition:none}
.nrow .ni{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--sunken);color:var(--ink-2)}
.nrow .ni svg{width:18px;height:18px}
.nrow .t{flex:1;min-width:0;line-height:1.5;font-size:14px}
.nrow .t .sub{margin-top:2px}
.nrow.unread .t b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:6px;vertical-align:2px}
.nrow.imp .content{box-shadow:inset 3px 0 0 var(--amber)}
.nrow.imp .ni{background:var(--amber-soft);color:var(--amber)}
.nrow.study .ni{background:var(--green-soft);color:var(--green-ink)}
.nrow .cta{margin-top:8px;display:flex;gap:6px}
.nrow.gone{transition:max-height .3s var(--e-out),opacity .2s;max-height:0!important;opacity:0}
.empty{padding:70px 40px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .eg{display:grid;grid-template-columns:repeat(5,12px);gap:3px}

// floating-label fields with validation
function bindField(f, validate){ const inp = f.querySelector('input,textarea'); const set = () => f.classList.toggle('up', !!inp.value || document.activeElement === inp);
  inp.addEventListener('focus', () => { f.classList.add('focus'); set(); }); inp.addEventListener('blur', () => { f.classList.remove('focus'); set(); if (validate) check(); }); inp.addEventListener('input', () => { set(); if (f.classList.contains('err') && validate) check(); });
  const check = () => { const m = validate(inp.value); f.classList.toggle('err', !!m); f.querySelector('.msg').textContent = m || ''; return !m; }; set(); return { check, inp }; }
// stepper with hold-to-accelerate
function bindStepper(el, min, max, val, onChange){ const out = el.querySelector('.sv span'); const minus = el.querySelector('[data-d="-1"]'), plus = el.querySelector('[data-d="1"]'); let t, n;
  const paint = quiet => { roll(out, String(val)); minus.disabled = val <= min; plus.disabled = val >= max; quiet || onChange && onChange(val); };
  const step = d => { const nv = Math.max(min, Math.min(max, val + d)); if (nv !== val) { val = nv; paint(); } };
  [minus, plus].forEach(b => { const d = +b.dataset.d; b.addEventListener('pointerdown', () => { step(d); n = 0; const rep = () => { n++; step(d); t = setTimeout(rep, Math.max(45, 200 - n * 18)); }; t = setTimeout(rep, 380); }); ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(t))); b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(d); } }); });
  paint(true); return () => val; }

        h += `<div class="nrow ${n.kind} ${state.notifRead.has(n.id) ? '' : 'unread'}" data-id="${n.id}" style="max-height:200px"><div class="acts"><span>既読にする</span><span>削除</span></div><div class="content"><span class="ni">${I[n.icon]}</span><div class="t"><b style="font-weight:500">${esc(n.title)}</b><div class="sub">${esc(n.sub)} · ${n.time}</div>${n.cta || n.join || n.follow ? `<div class="cta">${n.join ? `<button class="btn go small" data-nj="${n.join}">一緒に始める</button>` : ''}${n.cta ? `<button class="btn line small" data-cta="${n.id}">${n.cta}</button>` : ''}${n.follow ? `<button class="follow ${state.following.has(n.follow) ? 'on' : ''}" data-fl="${n.follow}">${state.following.has(n.follow) ? 'フォロー中' : 'フォローを返す'}</button>` : ''}</div>` : ''}</div></div></div>`; });
      body.innerHTML = h; bindSwipes(); };
    const bindSwipes = () => $$('.nrow', body).forEach(row => { const c = row.querySelector('.content'), acts = row.querySelector('.acts'); let x0 = null, dx = 0;
      c.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; x0 = e.clientX; dx = 0; row.classList.add('drag'); c.setPointerCapture(e.pointerId); });
      c.addEventListener('pointermove', e => { if (x0 === null) return; const sc = row.getBoundingClientRect().width / row.offsetWidth || 1; dx = (e.clientX - x0) / sc; c.style.transform = `translateX(${dx}px)`; acts.style.background = dx > 0 ? 'var(--blue)' : 'var(--red)'; acts.firstElementChild.style.opacity = dx > 0 ? 1 : 0; acts.lastElementChild.style.opacity = dx < 0 ? 1 : 0; });
      const up = () => { if (x0 === null) return; x0 = null; row.classList.remove('drag'); const id = +row.dataset.id;
        if (dx > 90) { state.notifRead.add(id); row.classList.remove('unread'); c.style.transform = ''; toast('既読にしました'); }
        else if (dx < -90) { c.style.transform = 'translateX(-110%)'; setTimeout(() => { row.classList.add('gone'); state.notifGone.add(id); setTimeout(draw, 300); }, 160); toast('削除しました', '', { label:'元に戻す', run:() => { state.notifGone.delete(id); draw(); } }); }
        else c.style.transform = ''; };
      c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up); c.addEventListener('click', e => { if (Math.abs(dx) < 4 && !e.target.closest('button')) { state.notifRead.add(+row.dataset.id); row.classList.remove('unread'); } }); });
    bindTabs(v.querySelector('#nTabs'), k => { filter = k; draw(); });
    body.addEventListener('click', e => { const j = e.target.closest('[data-nj]'); if (j) { if (state.running) { toast('もう勉強中です'); return; } startStudy(state.subj, j.dataset.nj); j.textContent = '勉強中'; j.disabled = true; }
      const f = e.target.closest('[data-fl]'); if (f) { const h = f.dataset.fl; state.following.has(h) ? state.following.delete(h) : state.following.add(h); f.classList.toggle('on'); f.textContent = state.following.has(h) ? 'フォロー中' : 'フォローを返す'; }
      const c = e.target.closest('[data-cta]'); if (c) { if (+c.dataset.cta === 6) { startStudy('en'); } else toast('外部のページを開きます', '申込は河合塾のサイトで行います'); } });
    v.querySelector('#readAll').addEventListener('click', () => { NOTIFS.forEach(n => state.notifRead.add(n.id)); $$('.nrow', body).forEach(r => r.classList.remove('unread')); toast('すべて既読にしました'); });
    draw(); },
};

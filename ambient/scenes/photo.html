<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Photo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .offline { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: rgba(255,255,255,0.6);
    font: 500 13px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: radial-gradient(circle at 50% 40%, #2a2a2e, #0b0b0c); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="offline" id="offline">画像を読み込めませんでした（オフライン？）</div>
<script src="shared/host.js"></script>
<script src="shared/digital.js"></script>
<script src="shared/effects.js"></script>
<script>
// A photo background with its digital recipe. The build fills PHOTO for each entry
// of scenes/photos.json; opening this file directly uses ?image=…&effect=… instead.
(() => {
  const PHOTO = /*PHOTO*/ null;
  const q = new URLSearchParams(location.search);
  const P = PHOTO || {
    image: q.get('image') || 'https://picsum.photos/id/1015/1170/2532',
    focus: [Number(q.get('fx') || 0.5), Number(q.get('fy') || 0.5)],
    recipe: { effect: q.get('effect') || 'ascii', params: {}, animate: q.get('animate') || 'shimmer' },
  };
  if (q.get('amount')) Host.digital = Number(q.get('amount'));

  const canvas = document.getElementById('gl');
  let d;
  try {
    d = Digital.create(canvas, { maxDpr: 2 });
  } catch (e) {
    document.getElementById('offline').style.display = 'flex';
    Host.start({ frame() {} });
    return;
  }
  d.setRecipe(P.recipe);
  d.setAmount(Host.digital);

  // Tell the app whether the clock area is light or dark, so its text stays readable.
  // Measured on the drawn picture (effects can darken or lighten it a lot), whenever
  // the picture, the size or the digital amount changes.
  let toneDue = true;
  let tone = '';
  function reportTone() {
    toneDue = false;
    const l = d.drawnLumaAt(Host.w * 0.15, Host.h * 0.36, Host.w * 0.85, Host.h * 0.6);
    const next = l > 0.55 ? 'light' : 'dark';
    if (next !== tone) {
      tone = next;
      Host.post({ type: 'tone', tone });
    }
  }

  d.setImage(P.image, { focus: P.focus || [0.5, 0.5] })
    .then(() => {
      Host.start({
        frame: (dt, t) => {
          if (Host.warming) return;
          d.draw(t);
          if (toneDue) reportTone();
        },
        resize: () => {
          d.resize();
          toneDue = true;
        },
        tap: (x, y) => d.tap(x, y, Host.time),
        digital: (v) => {
          d.setAmount(v);
          toneDue = true;
        },
      });
    })
    .catch(() => {
      document.getElementById('offline').style.display = 'flex';
      Host.start({ frame() {} });
    });
})();
</script>
</body>
</html>

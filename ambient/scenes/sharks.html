<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sharks</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fbfbfa; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; inset: 0; display: block; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<script src="shared/host.js"></script>
<script src="shared/ascii-sea.js"></script>
<script>
// Shallows on a bright day: hammerheads and a leopard shark drawn in type. Tap to feed.
(() => {
  const { lerp, noise2 } = Host;

  // Every shark uses five tones, darkest to palest, plus an eye colour.
  const tones = (dark, mid, light, pale, eye) => [
    { fill: dark, glyph: '#eef0f3' },
    { fill: mid, glyph: '#f6f7f8' },
    { fill: light, glyph: '#2a2e36' },
    { fill: pale, glyph: '#3a3f48' },
    { fill: eye, glyph: '#dfe3ea' },
  ];
  const D = 0, M = 1, L = 2, P = 3, EYE = 4;

  const sharkBody = (u) =>
    u < 0.06 ? lerp(0.45, 0.8, u / 0.06)
    : u < 0.22 ? lerp(0.8, 1, (u - 0.06) / 0.16)
    : u < 0.42 ? 1
    : lerp(1, 0.1, Math.pow((u - 0.42) / 0.58, 1.15));

  // Countershaded: darker down the spine, paler toward the flanks and fins.
  const countershade = (t, s, n, part, h) => {
    const side = Math.abs(s);
    if (part === 3) return side > 0.86 ? EYE : n > 0.5 ? D : M;
    if (part === 1 || part === 2) return h > 0.45 ? M : L;
    if (side < 0.35) return n > 0.45 ? D : M;
    if (side < 0.72) return n > 0.6 ? M : L;
    return h > 0.4 ? L : P;
  };

  const hammerhead = {
    id: 'hammerhead',
    length: 24,
    width: 0.105,
    profile: sharkBody,
    speed: 2.3,
    agility: 0.75,
    beat: 3.6,
    wave: 0.04,
    fins: [
      { at: 0.3, len: 0.2, root: 0.085, tip: 0.016, sweep: 0.85, flap: 0.2, solid: 0.9 },
      { at: 0.64, len: 0.07, root: 0.04, tip: 0.012, sweep: 0.75, flap: 0.2, solid: 0.75 },
    ],
    tail: 0.24,
    tailSpread: 0.09,
    tailShape: 1.1,
    fork: 0.5,
    tailSolid: 0.75,
    hammer: 0.13,
    shimmer: 2,
    patternScale: [7, 1.4],
    fillFrom: 0.06,
    accents: ['#2f8f6f', '#8a6ad8'],
    palette: tones('#56607a', '#7d879e', '#a9b1c3', '#cdd2dc', '#20242d'),
    paint: (t, s, n, part, pattern, h) => countershade(t, s, n, part, h),
  };

  const leopard = {
    id: 'leopard',
    length: 21,
    width: 0.1,
    profile: sharkBody,
    speed: 1.9,
    agility: 1.1,
    beat: 4.2,
    wave: 0.05,
    fins: [
      { at: 0.28, len: 0.16, root: 0.08, tip: 0.016, sweep: 0.85, flap: 0.3, solid: 0.85 },
      { at: 0.6, len: 0.07, root: 0.04, tip: 0.012, sweep: 0.8, flap: 0.3, solid: 0.75 },
    ],
    tail: 0.26,
    tailSpread: 0.07,
    tailShape: 1.2,
    fork: 0.35,
    tailSolid: 0.75,
    hammer: 0,
    shimmer: 2.4,
    patternScale: [6, 1.4],
    fillFrom: 0.06,
    accents: ['#2f8f6f', '#c0607e'],
    palette: tones('#463b30', '#6c5f4d', '#9d907b', '#d0c7b7', '#1e1914'),
    // Saddles and spots: high-frequency noise picks dark blotches and pale freckles.
    paint(t, s, n, part, pattern, h) {
      if (part === 1 || part === 2) return h > 0.5 ? L : M;
      const spot = noise2(t * 22, s * 3.2, 31);
      if (spot > 0.7) return P;
      if (spot < 0.22) return D;
      return Math.abs(s) < 0.5 ? M : L;
    },
  };

  const blue = {
    ...hammerhead,
    id: 'blue',
    length: 24,
    width: 0.085,
    hammer: 0,
    speed: 2.6,
    fins: [
      { at: 0.3, len: 0.25, root: 0.075, tip: 0.014, sweep: 0.9, flap: 0.15, solid: 0.9 },
      { at: 0.62, len: 0.06, root: 0.035, tip: 0.01, sweep: 0.8, flap: 0.2, solid: 0.75 },
    ],
    accents: ['#8a6ad8'],
    palette: tones('#4a5a86', '#6c7ba6', '#9ba7c8', '#c6cde2', '#1c2236'),
  };

  AsciiSea.create({
    theme: {
      bg: '#fbfbfa',
      grid: 'rgba(0,0,0,0.05)',
      vignette: null,
      glow: false,
      shadow: [44, 48, 58],
      shadowAlpha: 0.2,
      shadowOffset: 0.9,
    },
    species: [hammerhead, leopard, blue],
    school: [
      { species: 'hammerhead', depth: 0.05 },
      { species: 'hammerhead', depth: 0.55 },
      { species: 'leopard', depth: 0.15 },
      { species: 'blue', depth: 0.75, scales: false },
    ],
    particles: 'dashes',
    ambientGlyph: '#7d828b',
    rippleGlyph: '#6f7684',
    pellet: { fill: '#e2b04c', glyph: '#3a2a0a' },
  });
})();
</script>
</body>
</html>

  html, body { margin: 0; height: 100%; overflow: hidden; background: #fafaf8; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

<script src="shared/host.js"></script>
<script>
// A blank sheet of paper: nothing moves, so nothing is drawn after the first frame.
(() => {
  Host.start({ frame() {}, resize() {}, tap() {} });
})();
</script>
